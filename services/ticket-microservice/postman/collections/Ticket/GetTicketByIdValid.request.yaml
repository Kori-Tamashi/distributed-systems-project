$kind: http-request
order: 600
method: GET
url: '{{baseUrl}}/api/v1/tickets/1'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('Status is 200 or 404', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });
      if (pm.response.code === 200) {
        pm.test('Has TicketId or Id', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('TicketId').or.have.property('Id');
        });
      }
