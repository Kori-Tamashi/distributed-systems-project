  ## Ticket API Tests - Lab 02
  
  **Микросервис:** Ticket (port 8070)  
  **Дата:** 2026-09-20
  
  ### Особенности API:
  - Возвращает массив напрямую (не {items: [...]})
  - PascalCase свойства (FlightId, SeatNumber, PassengerName, etc.)
  - DELETE возвращает 204 NoContent
  - PUT может возвращать 405 (не поддерживается)
