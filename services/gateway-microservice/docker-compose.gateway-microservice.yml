services:
  # =============================================================================
  # Gateway Microservice API (Production)
  # =============================================================================
  gateway-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-api
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - DATABASE_PROVIDER=POSTGRESQL
      - ASPNETCORE_URLS=http://+:8080
      # Inter-Service Communication
      - FLIGHT_CONNECTIONSTRINGS_DEFAULTCONNECTION=${FLIGHT_CONNECTIONSTRINGS_DEFAULTCONNECTION}
      - TICKET_CONNECTIONSTRINGS_DEFAULTCONNECTION=${TICKET_CONNECTIONSTRINGS_DEFAULTCONNECTION}
      - BONUS_CONNECTIONSTRINGS_DEFAULTCONNECTION=${BONUS_CONNECTIONSTRINGS_DEFAULTCONNECTION}
      # API URLs for Gateway (Lab 3)
      - FLIGHT_API_URL=http://flight-api:8060
      - TICKET_API_URL=http://ticket-api:8070
      - BONUS_API_URL=http://bonus-api:8050
    ports:
      - "${API_PORT}:8080"
    networks:
      - rsoi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/manage/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =============================================================================
  # Gateway Microservice API (Test)
  # =============================================================================
  gateway-api-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-microservice-api-test
    profiles:
      - test
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DATABASE_PROVIDER=POSTGRESQL
      - ASPNETCORE_URLS=http://+:8040
      # Inter-Service Communication
      - FLIGHT_CONNECTIONSTRINGS_DEFAULTCONNECTION=${FLIGHT_CONNECTIONSTRINGS_DEFAULTCONNECTION}
      - TICKET_CONNECTIONSTRINGS_DEFAULTCONNECTION=${TICKET_CONNECTIONSTRINGS_DEFAULTCONNECTION}
      - BONUS_CONNECTIONSTRINGS_DEFAULTCONNECTION=${BONUS_CONNECTIONSTRINGS_DEFAULTCONNECTION}
    ports:
      - "${TEST_API_PORT}:8040"
    networks:
      - rsoi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/manage/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
