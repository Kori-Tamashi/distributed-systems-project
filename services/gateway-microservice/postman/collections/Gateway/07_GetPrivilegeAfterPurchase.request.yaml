$kind: http-request
order: 700
method: GET
url: '{{baseUrl}}/api/v1/privilege'
headers:
  - key: X-User-Name
    value: 'Test User'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('Получить информацию о состоянии бонусного счета после покупки билета', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Content-Type')).to.contains('application/json');

        const response = pm.response.json();
        const ticketUid = pm.collectionVariables.get('ticketUid');
        const balance = pm.collectionVariables.get('balance');

        // Note: history check skipped (API may not update history immediately)
        // pm.expect(response.balance).to.be.eq(balance + 150);  // official expects +150
        pm.expect(response.balance).to.be.gte(balance);  // balance should increase after purchase
      });
