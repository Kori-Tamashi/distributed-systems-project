$kind: http-request
order: 300
method: POST
url: '{{baseUrl}}/api/v1/airports'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "Name": "Test Airport",
      "City": "Test City",
      "Country": "Test Country",
      "IataCode": "TST",
      "Latitude": 55.0,
      "Longitude": 37.0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('Status is 201', function () { pm.response.to.have.status(201); });
      pm.test('Has Name', function () { pm.expect(pm.response.json()).to.have.property('Name'); });
