$kind: http-request
order: 400
method: POST
url: '{{baseUrl}}/api/v1/airports'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "Name": "",
      "City": "Test",
      "Country": "Test",
      "IataCode": "TST",
      "Latitude": 55.0,
      "Longitude": 37.0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('Status is 400, 500, or 201', function () {
        pm.expect(pm.response.code).to.be.oneOf([400, 500, 201]);
      });
