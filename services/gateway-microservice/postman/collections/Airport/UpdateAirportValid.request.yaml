$kind: http-request
order: 900
method: PUT
url: '{{baseUrl}}/api/v1/airports/6'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated",
      "city": "Updated",
      "country": "Updated",
      "iataCode": "UPT",
      "latitude": 55.0,
      "longitude": 37.0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('Status is 200 or 404', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });
