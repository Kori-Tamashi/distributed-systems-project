$kind: http-request
order: 400
method: POST
url: '{{baseUrl}}/api/v1/tickets'
headers:
  - key: X-User-Name
    value: Test User
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "FlightId": 0,
      "SeatNumber": "",
      "PassengerName": "",
      "PassengerEmail": "",
      "TicketClass": "",
      "price": 0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('Status is 400, 500, or 201', function () {
        pm.expect(pm.response.code).to.be.oneOf([400, 500, 201]);
      });
