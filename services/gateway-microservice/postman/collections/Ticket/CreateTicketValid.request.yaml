$kind: http-request
order: 300
method: POST
url: "{{baseUrl}}/api/v1/tickets"
headers:
  X-User-Name: Test User
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "flightNumber": "AFL032",
      "price": 1500,
      "paidFromBalance": false
    }
scripts:
  - type: afterResponse
    code: |
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Has ticketUid', function () { pm.expect(pm.response.json()).to.have.property('ticketUid'); });
    language: text/javascript
