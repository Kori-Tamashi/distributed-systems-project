$kind: http-request
order: 300
method: POST
url: '{{baseUrl}}/api/v1/tickets'
headers:
  - key: X-User-Name
    value: Test User
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "flightNumber": "AFL031",
      "price": 1500,
      "paidFromBalance": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Has ticketUid', function () { pm.expect(pm.response.json()).to.have.property('ticketUid'); });
