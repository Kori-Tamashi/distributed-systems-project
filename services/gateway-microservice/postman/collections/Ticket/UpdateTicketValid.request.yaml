$kind: http-request
order: 900
method: PUT
url: '{{baseUrl}}/api/v1/tickets/1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "Id": 1,
      "FlightId": 1,
      "SeatNumber": "2B",
      "PassengerName": "Updated",
      "PassengerEmail": "updated@example.com",
      "TicketClass": "Business",
      "Price": 10000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('Status is 200, 405, or 404', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 405, 404]);
      });
