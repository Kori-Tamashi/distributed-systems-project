$kind: http-request
order: 900
method: PUT
url: '{{baseUrl}}/api/v1/bookings/1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "BookingId": 1,
      "CustomerName": "Updated",
      "CustomerEmail": "updated@example.com",
      "TotalPrice": 15000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('Status is 200, 405, or 404', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 405, 404]);
      });
