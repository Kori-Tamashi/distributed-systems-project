# ===========================================
# CD Pipeline - Push Docker Image to Docker Hub
# ===========================================

name: CD - Push Docker Image

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/person-api

jobs:
  # ===========================================
  # Build and Push Docker Image
  # ===========================================
  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.workflow_run.head_commit.timestamp }}
            VERSION=${{ github.event.workflow_run.head_sha }}

      - name: Deployment summary
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "Image: ${{ env.DOCKER_IMAGE }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "CI Run: ${{ github.event.workflow_run.html_url }}"
          echo ""
          echo "📦 Image available at:"
          echo "https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/person-api"
