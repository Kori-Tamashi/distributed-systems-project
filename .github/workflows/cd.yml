# ===========================================
# CD Pipeline - Build, Push & Deploy
# ===========================================
# Lab 04: Distributed Systems (Kubernetes + Helm)
# Services: Gateway, Flight, Ticket, Bonus

name: CD - Build Push Deploy

on:
  workflow_run:
    workflows: ["CI - Build and Test All Microservices"]
    types:
      - completed
    branches: [main, lab_04]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}

jobs:
  # ===========================================
  # Build and Push Docker Images
  # ===========================================
  docker-build-and-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - flight
          - ticket
          - bonus

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}-microservice
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}-microservice/
          file: services/${{ matrix.service }}-microservice/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          echo "✅ ${{ matrix.service }} Docker image pushed successfully!"
          echo "Image: ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}-microservice"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ===========================================
  # Deploy to Kubernetes (Lab 04)
  # ===========================================
  deploy-k8s:
    name: Deploy to Kubernetes
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          if echo "${{ secrets.KUBE_CONFIG }}" | base64 -d >/dev/null 2>&1; then
            echo "📦 KUBE_CONFIG is base64 encoded"
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          else
            echo "📦 KUBE_CONFIG is raw text"
            echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubectl
        run: |
          kubectl cluster-info
          kubectl config set-context --current
            --namespace=${{ env.KUBE_NAMESPACE }}

      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.KUBE_NAMESPACE }}
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply PostgreSQL manifests
        run: |
          echo "📦 Applying PostgreSQL manifests..."
          kubectl apply -f deploy/k8s/postgres/namespace.yaml
          kubectl apply -f deploy/k8s/postgres/secret.yaml
          kubectl apply -f deploy/k8s/postgres/configmap-init.yaml
          kubectl apply -f deploy/k8s/postgres/service.yaml
          kubectl apply -f deploy/k8s/postgres/statefulset.yaml
          echo "⏳ Waiting for PostgreSQL to be ready..."
          kubectl wait --for=condition=Ready pod -l app=postgres
            -n ${{ env.KUBE_NAMESPACE }} --timeout=300s

      - name: Seed flight database
        run: |
          kubectl exec -n ${{ env.KUBE_NAMESPACE }} postgres-0 -- sh -c "
            PGPASSWORD=postgres-admin-password psql -U postgres -d flight -c \\
              \"INSERT INTO airports (id, name, city, country) VALUES
                (1, 'Шереметьево', 'Москва', 'Россия'),
                (2, 'Пулково', 'Санкт-Петербург', 'Россия')
              ON CONFLICT (id) DO NOTHING;\"
          kubectl exec -n ${{ env.KUBE_NAMESPACE }} postgres-0 -- sh -c "
            PGPASSWORD=postgres-admin-password psql -U postgres -d flight -c \\
              \"INSERT INTO flights (id, flight_uid, flight_number, datetime,
                from_airport_id, to_airport_id, price) VALUES
                (1, 'a1b2c3d4-e5f6-7890-abcd-ef1234567890', 'AFL031',
                '2021-10-08 20:00', 1, 2, 1500)
              ON CONFLICT (id) DO NOTHING;\"
          echo "✅ Flight DB seeded"

      - name: Seed bonus database
        run: |
          kubectl exec -n ${{ env.KUBE_NAMESPACE }} postgres-0 -- sh -c "
            PGPASSWORD=postgres-admin-password psql -U postgres -d bonus -c \\
              \"INSERT INTO privilege (id, username, status, balance) VALUES
                (1, 'Test User', 0, 0)
              ON CONFLICT (username) DO NOTHING;\"
          " || echo "Bonus seed skipped (may already exist)"

      - name: Deploy Gateway
        run: |
          echo "🚀 Deploying Gateway..."
          helm upgrade --install gateway deploy/helm/microservice \
            -f deploy/values/gateway.yaml \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.tag=latest \
            --wait --timeout=300s

      - name: Deploy Flight
        run: |
          echo "🚀 Deploying Flight..."
          helm upgrade --install flight deploy/helm/microservice \
            -f deploy/values/flight.yaml \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.tag=latest \
            --wait --timeout=300s

      - name: Deploy Ticket
        run: |
          echo "🚀 Deploying Ticket..."
          helm upgrade --install ticket deploy/helm/microservice \
            -f deploy/values/ticket.yaml \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.tag=latest \
            --wait --timeout=300s

      - name: Deploy Bonus
        run: |
          echo "🚀 Deploying Bonus..."
          helm upgrade --install bonus deploy/helm/microservice \
            -f deploy/values/bonus.yaml \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.tag=latest \
            --wait --timeout=300s

      - name: Verify deployments
        run: |
          echo "✅ Verifying deployments..."
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
          kubectl get deployments -n ${{ env.KUBE_NAMESPACE }}
          kubectl get services -n ${{ env.KUBE_NAMESPACE }}

          echo ""
          echo "📊 Deployment Status:"
          for svc in gateway flight ticket bonus; do
            status=$(kubectl get deployment $svc -n ${{ env.KUBE_NAMESPACE }}
              -o jsonpath='{.status.availableReplicas}')
            if [ "$status" = "1" ]; then
              echo "  ✅ $svc: ready"
            else
              echo "  ❌ $svc: not ready ($status)"
            fi
          done

      - name: Deployment summary
        run: |
          echo ""
          echo "=========================================="
          echo "🎉 Deployment Complete!"
          echo "=========================================="
          echo "Namespace: ${{ env.KUBE_NAMESPACE }}"
          echo ""
          echo "Services:"
          echo "  - Gateway:  http://<ingress-ip>/api/v1/..."
          echo "  - Flight:   ClusterIP (internal)"
          echo "  - Ticket:   ClusterIP (internal)"
          echo "  - Bonus:    ClusterIP (internal)"
          echo ""
          echo "PostgreSQL:"
          echo "  - Host: postgres.${{ env.KUBE_NAMESPACE }}.svc.cluster.local"
          echo "  - Port: 5432"
          echo ""
          echo "To view logs:"
          echo "  kubectl get pods -n ${{ env.KUBE_NAMESPACE }}"
          echo "  kubectl logs -f deployment/gateway
            -n ${{ env.KUBE_NAMESPACE }}"
