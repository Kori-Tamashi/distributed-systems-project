# ===========================================
# CD Pipeline - Build, Push & Deploy
# ===========================================
# Lab 04: Distributed Systems (Kubernetes + Helm)
# Services: Gateway, Flight, Ticket, Bonus

name: CD - Build Push Deploy

on:
  push:
    branches: [main, lab_04]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}

jobs:
  # ===========================================
  # Build and Push Docker Images
  # ===========================================
  docker-build-and-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - flight
          - ticket
          - bonus

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}-microservice
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}-microservice/
          file: services/${{ matrix.service }}-microservice/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          echo "✅ ${{ matrix.service }} Docker image pushed successfully!"
          echo "Image: ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}-microservice"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ===========================================
  # Deploy to Kubernetes (Lab 04)
  # ===========================================
  deploy-k8s:
    name: Deploy to Kubernetes
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          if echo "${{ secrets.KUBE_CONFIG }}" | base64 -d >/dev/null 2>&1; then
            echo "📦 KUBE_CONFIG is base64 encoded"
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          else
            echo "📦 KUBE_CONFIG is raw text"
            echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubectl
        run: |
          kubectl cluster-info
          kubectl config set-context --current \
            --namespace=${{ env.KUBE_NAMESPACE }}

      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.KUBE_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply PostgreSQL manifests
        run: |
          NS="${{ env.KUBE_NAMESPACE }}"
          echo "📦 Applying PostgreSQL manifests to namespace $NS..."

          # Clean up old statefulset and pending PVC if they exist
          kubectl delete statefulset postgres -n "$NS" \
            --ignore-not-found --wait=true || true
          kubectl delete pvc -n "$NS" -l app=postgres \
            --ignore-not-found || true

          kubectl apply -n "$NS" -f deploy/k8s/postgres/namespace.yaml || true
          kubectl apply -n "$NS" -f deploy/k8s/postgres/secret.yaml
          kubectl apply -n "$NS" -f deploy/k8s/postgres/configmap-init.yaml
          kubectl apply -n "$NS" -f deploy/k8s/postgres/service.yaml
          kubectl apply -n "$NS" -f deploy/k8s/postgres/statefulset.yaml

          echo "--- Debug: where are statefulsets ---"
          kubectl get statefulsets -A

          echo "⏳ Waiting for PostgreSQL StatefulSet (max 300s)..."
          if ! kubectl rollout status statefulset/postgres \
              -n "$NS" --timeout=300s; then
            echo "❌ PostgreSQL rollout FAILED. Dumping diagnostics..."

            echo "=== pods ==="
            kubectl get pods -n "$NS" -l app=postgres -o wide || true

            echo "=== pvc ==="
            kubectl get pvc -n "$NS" || true

            echo "=== storageclasses ==="
            kubectl get storageclass || true

            echo "=== describe pod ==="
            POD=$(kubectl get pods -n "$NS" -l app=postgres \
              -o jsonpath='{.items[0].metadata.name}' || echo "")
            if [ -n "$POD" ]; then
              kubectl describe pod "$POD" -n "$NS" | tail -60 || true
              echo "=== postgres container logs ==="
              kubectl logs "$POD" -n "$NS" -c postgres --tail=80 2>&1 || true
              echo "=== previous logs ==="
              kubectl logs "$POD" -n "$NS" -c postgres \
                --previous --tail=80 2>&1 || true
            fi

            echo "=== events ==="
            kubectl get events -n "$NS" \
              --sort-by=.lastTimestamp | tail -30 || true

            exit 1
          fi

          echo "✅ PostgreSQL StatefulSet ready"
          echo "PostgreSQL pod status:"
          kubectl get pods -n "$NS" -l app=postgres -o wide || true
          echo ""
          echo "Recent events in namespace:"
          kubectl get events -n "$NS" \
            --sort-by=.lastTimestamp | tail -20 || true


      - name: Deploy Gateway
        run: |
          echo "🚀 Deploying Gateway..."
          NS="${{ env.KUBE_NAMESPACE }}"
          SHA="${{ github.sha }}"
          helm upgrade --install gateway deploy/helm/microservice \
            -f deploy/values/gateway.yaml \
            --namespace "$NS" \
            --set image.repository="${{ env.DOCKER_USERNAME }}"/gateway-microservice \
            --set image.tag="$SHA"
          kubectl rollout restart deployment/gateway -n "$NS"
          sleep 3

      - name: Deploy Flight
        run: |
          echo "🚀 Deploying Flight..."
          NS="${{ env.KUBE_NAMESPACE }}"
          SHA="${{ github.sha }}"
          helm upgrade --install flight deploy/helm/microservice \
            -f deploy/values/flight.yaml \
            --namespace "$NS" \
            --set image.repository="${{ env.DOCKER_USERNAME }}"/flight-microservice \
            --set image.tag="$SHA"
          kubectl rollout restart deployment/flight -n "$NS"
          sleep 3

      - name: Deploy Ticket
        run: |
          echo "🚀 Deploying Ticket..."
          NS="${{ env.KUBE_NAMESPACE }}"
          SHA="${{ github.sha }}"
          helm upgrade --install ticket deploy/helm/microservice \
            -f deploy/values/ticket.yaml \
            --namespace "$NS" \
            --set image.repository="${{ env.DOCKER_USERNAME }}"/ticket-microservice \
            --set image.tag="$SHA"
          kubectl rollout restart deployment/ticket -n "$NS"
          sleep 3

      - name: Deploy Bonus
        run: |
          echo "🚀 Deploying Bonus..."
          NS="${{ env.KUBE_NAMESPACE }}"
          SHA="${{ github.sha }}"
          helm upgrade --install bonus deploy/helm/microservice \
            -f deploy/values/bonus.yaml \
            --namespace "$NS" \
            --set image.repository="${{ env.DOCKER_USERNAME }}"/bonus-microservice \
            --set image.tag="$SHA"
          kubectl rollout restart deployment/bonus -n "$NS"
          sleep 3

      - name: Wait for all deployments to be ready
        run: |
          NS="${{ env.KUBE_NAMESPACE }}"
          echo "⏳ Waiting for all deployments to be ready (max 300s each)..."
          for svc in gateway flight ticket bonus; do
            echo "--- $svc ---"
            if ! kubectl rollout status deployment/$svc \
                -n "$NS" --timeout=300s; then
              echo "❌ $svc rollout failed"
              kubectl get pods -n "$NS" -l app.kubernetes.io/name="$svc" || true
              kubectl describe deployment "$svc" -n "$NS" | tail -40 || true
              kubectl get events -n "$NS" \
                --sort-by=.lastTimestamp | tail -20 || true
              exit 1
            fi
          done
          echo "✅ All deployments ready"

      - name: Seed flight database
        run: |
          NS="${{ env.KUBE_NAMESPACE }}"
          echo "🌱 Seeding flight DB..."
          kubectl exec -i -n "$NS" postgres-0 -- \
            env PGPASSWORD=postgres-admin-password \
            psql -U postgres -d flight <<'SQL'
          INSERT INTO airports (id, name, city, country) VALUES
            (1, 'Шереметьево', 'Москва', 'Россия'),
            (2, 'Пулково', 'Санкт-Петербург', 'Россия')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO flights (id, flight_uid, flight_number, datetime,
              from_airport_id, to_airport_id, price) VALUES
            (1, 'a1b2c3d4-e5f6-7890-abcd-ef1234567890', 'AFL031',
              '2021-10-08 20:00', 2, 1, 1500)
          ON CONFLICT (id) DO NOTHING;
          SQL
          echo "✅ Flight DB seeded"

      - name: Seed bonus database
        run: |
          NS="${{ env.KUBE_NAMESPACE }}"
          echo "🌱 Seeding bonus DB..."
          kubectl exec -i -n "$NS" postgres-0 -- \
            env PGPASSWORD=postgres-admin-password \
            psql -U postgres -d bonus <<'SQL'
          INSERT INTO privilege (id, username, status, balance) VALUES
            (1, 'Test User', 0, 0)
          ON CONFLICT (username) DO NOTHING;
          SQL
          echo "✅ Bonus DB seeded"

      - name: Verify deployments
        run: |
          echo "✅ Verifying deployments..."
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
          kubectl get deployments -n ${{ env.KUBE_NAMESPACE }}
          kubectl get services -n ${{ env.KUBE_NAMESPACE }}

          echo ""
          echo "📊 Deployment Status:"
          for svc in gateway flight ticket bonus; do
            status=$(kubectl get deployment $svc -n ${{ env.KUBE_NAMESPACE }} \
              -o jsonpath='{.status.availableReplicas}')
            if [ "$status" = "1" ]; then
              echo "  ✅ $svc: ready"
            else
              echo "  ❌ $svc: not ready ($status)"
            fi
          done

      - name: Deployment summary
        run: |
          echo ""
          echo "=========================================="
          echo "🎉 Deployment Complete!"
          echo "=========================================="
          echo "Namespace: ${{ env.KUBE_NAMESPACE }}"
          echo ""
          echo "Services:"
          echo "  - Gateway:  http://<ingress-ip>/api/v1/..."
          echo "  - Flight:   ClusterIP (internal)"
          echo "  - Ticket:   ClusterIP (internal)"
          echo "  - Bonus:    ClusterIP (internal)"
          echo ""
          echo "PostgreSQL:"
          echo "  - Host: postgres.${{ env.KUBE_NAMESPACE }}.svc.cluster.local"
          echo "  - Port: 5432"
          echo ""
          echo "To view logs:"
          echo "  kubectl get pods -n ${{ env.KUBE_NAMESPACE }}"
          echo "  kubectl logs -f deployment/gateway"
          echo "    -n ${{ env.KUBE_NAMESPACE }}"

  # ===========================================
  # Autograding Tests
  # ===========================================
  autograding:
    name: Autograding - Instructor Tests
    runs-on: ubuntu-latest
    needs: deploy-k8s
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Postman Newman image for Instructor Tests
        run: |
          echo "Building Postman Newman image for Instructor Tests..."
          docker build \
            --tag postman-newman-instructor:e2e \
            -f postman/Dockerfile \
            postman/
          echo "✅ Postman Newman image built: postman-newman-instructor:e2e"

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          if echo "${{ secrets.KUBE_CONFIG }}" | base64 -d >/dev/null 2>&1; then
            echo "📦 KUBE_CONFIG is base64 encoded"
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          else
            echo "📦 KUBE_CONFIG is raw text"
            echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config
          export KUBECONFIG=$HOME/.kube/config
          echo "✅ kubectl configured"

      - name: Diagnostics (always)
        if: always()
        run: |
          set +e
          NS="${{ env.KUBE_NAMESPACE }}"
          export KUBECONFIG=$HOME/.kube/config

          echo "=== Pods & images ==="
          kubectl get pods -n "$NS" -o wide
          echo ""
          for p in $(kubectl get pods -n "$NS" -o jsonpath='{.items[*].metadata.name}'); do
            img=$(kubectl get pod "$p" -n "$NS" -o jsonpath='{.spec.containers[0].image}')
            echo "pod=$p image=$img"
          done

          # СТАРТОВЫЕ логи (с момента запуска pod'а)
          for svc in flight bonus gateway ticket; do
            POD=$(kubectl get pod -n "$NS" -l app.kubernetes.io/name=$svc -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -n "$POD" ]; then
              echo ""
              echo "=== $svc STARTUP logs (first 200 lines from last 20m) ==="
              kubectl logs -n "$NS" "$POD" --since=20m 2>&1 | head -200 || true
              echo ""
              echo "=== $svc logs grep migrations/warnings ==="
              kubectl logs -n "$NS" "$POD" --since=20m 2>&1 | grep -iE "migration|warning|could not|exception|applied|ensure" | head -30 || true
            fi
          done

          # Проверяем какие таблицы РЕАЛЬНО существуют в БД
          PG=$(kubectl get pod -n "$NS" -l app=postgres -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$PG" ]; then
            echo ""
            echo "=== Bonus DB tables ==="
            kubectl exec -n "$NS" "$PG" -- psql -U bonus -d bonus -c '\dt' 2>&1 || true
            echo ""
            echo "=== Bonus DB privilege rows ==="
            kubectl exec -n "$NS" "$PG" -- psql -U bonus -d bonus -c 'SELECT id, username, status, balance FROM privilege;' 2>&1 || true
            echo ""
            echo "=== Bonus DB __EFMigrationsHistory ==="
            kubectl exec -n "$NS" "$PG" -- psql -U bonus -d bonus -c 'SELECT * FROM "__EFMigrationsHistory";' 2>&1 || true
            echo ""
            echo "=== Flight DB tables ==="
            kubectl exec -n "$NS" "$PG" -- psql -U flight -d flight -c '\dt' 2>&1 || true
            echo ""
            echo "=== Flight DB airports rows ==="
            kubectl exec -n "$NS" "$PG" -- psql -U flight -d flight -c \
              'SELECT id, name, city FROM airports ORDER BY id;' 2>&1 || true
            echo ""
            echo "=== Flight DB flights rows ==="
            kubectl exec -n "$NS" "$PG" -- psql -U flight -d flight -c \
              'SELECT id, flight_number, from_airport_id, ' \
              'to_airport_id FROM flights ORDER BY id;' 2>&1 || true
            echo ""
            echo "=== Flight DB __EFMigrationsHistory ==="
            kubectl exec -n "$NS" "$PG" -- psql -U flight -d flight -c \
              'SELECT * FROM "__EFMigrationsHistory";' 2>&1 || true
            echo ""
            echo "=== List all databases ==="
            kubectl exec -n "$NS" "$PG" -- psql -U postgres -c '\l' 2>&1 || true
          fi

      - name: Run autograding tests via port-forward
        run: |
          set -e
          NS="${{ env.KUBE_NAMESPACE }}"
          export KUBECONFIG=$HOME/.kube/config

          echo "🔌 Port-forwarding Gateway service..."
          kubectl port-forward -n "$NS" svc/gateway 8080:8080 &
          PORT_FWD_PID=$!

          # Wait for port-forward to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/manage/health >/dev/null 2>&1 \
              ; then
              echo "✅ Port-forward ready"; break
            fi
            echo "  Waiting for port-forward... ($i/30)"
            sleep 2
          done

          echo "🧪 Running autograding Postman tests..."
          mkdir -p postman/test-results
          docker run --rm --network=host \
            -v $(pwd)/postman/test-results:/etc/newman/results \
            postman-newman-instructor:e2e \
            run /etc/newman/collection.json \
              -e /etc/newman/environment.json \
              --env-var "baseUrl=http://localhost:8080" \
              --env-var "username=Test User" \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/results.xml

          echo "✅ Autograding tests completed"

      - name: Upload Autograding test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autograding-junit-results
          path: postman/test-results/results.xml
          retention-days: 7
          if-no-files-found: error

      - name: Publish Autograding test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Autograding - Instructor Tests (Postman)
          path: postman/test-results/results.xml
          reporter: java-junit

      - name: Cleanup port-forward
        if: always()
        run: |
          echo "🧹 Cleaning up port-forward..."
          kill $PORT_FWD_PID 2>/dev/null || true
          echo "✅ Cleanup complete"

  # ===========================================
  # Fault Tolerance Tests
  # ===========================================
  fault-tolerance:
    name: Fault Tolerance - Bonus Service Failover
    runs-on: ubuntu-latest
    needs: autograding
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Postman Newman image for Instructor Tests
        run: |
          echo "Building Postman Newman image for Instructor Tests..."
          docker build \
            --tag postman-newman-instructor:e2e \
            -f postman/Dockerfile \
            postman/
          echo "✅ Postman Newman image built: postman-newman-instructor:e2e"

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          if echo "${{ secrets.KUBE_CONFIG }}" | base64 -d >/dev/null 2>&1; then
            echo "📦 KUBE_CONFIG is base64 encoded"
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          else
            echo "📦 KUBE_CONFIG is raw text"
            echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config
          export KUBECONFIG=$HOME/.kube/config
          echo "✅ kubectl configured"

      - name: Run fault-tolerance tests via port-forward
        run: |
          set -e
          NS="${{ env.KUBE_NAMESPACE }}"
          export KUBECONFIG=$HOME/.kube/config

          echo "🔌 Port-forwarding Gateway service..."
          kubectl port-forward -n "$NS" svc/gateway 8080:8080 &
          PORT_FWD_PID=$!

          # Wait for port-forward to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/manage/health >/dev/null 2>&1 \
              ; then
              echo "✅ Port-forward ready"; break
            fi
            echo "  Waiting for port-forward... ($i/30)"
            sleep 2
          done

          echo "🧪 Running success folder (baseline)..."
          mkdir -p postman/test-results
          docker run --rm --network=host \
            -v $(pwd)/postman/test-results:/etc/newman/results \
            postman-newman-instructor:e2e \
            run /etc/newman/fault-tolerance-collection.json \
              -e /etc/newman/environment.json \
              --env-var "baseUrl=http://localhost:8080" \
              --env-var "username=Test User" \
              --folder success \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/success.xml

          echo "🧪 Running step1 (Bonus stopped)..."
          kubectl scale -n "$NS" deployment/bonus --replicas=0
          sleep 5
          docker run --rm --network=host \
            -v $(pwd)/postman/test-results:/etc/newman/results \
            postman-newman-instructor:e2e \
            run /etc/newman/fault-tolerance-collection.json \
              -e /etc/newman/environment.json \
              --env-var "baseUrl=http://localhost:8080" \
              --env-var "username=Test User" \
              --folder step1 \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/step1.xml

          echo "🧪 Running step2 (Bonus started)..."
          kubectl scale -n "$NS" deployment/bonus --replicas=1
          sleep 10
          docker run --rm --network=host \
            -v $(pwd)/postman/test-results:/etc/newman/results \
            -v $(pwd)/postman:/etc/newman-host \
            postman-newman-instructor:e2e \
            run /etc/newman/fault-tolerance-collection.json \
              -e /etc/newman/environment.json \
              --env-var "baseUrl=http://localhost:8080" \
              --env-var "username=Test User" \
              --folder step2 \
              --export-environment /etc/newman-host/env-after-step2.json \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/step2.xml

          echo "🧪 Running step3 (Bonus stopped again)..."
          kubectl scale -n "$NS" deployment/bonus --replicas=0
          sleep 5
          docker run --rm --network=host \
            -v $(pwd)/postman/test-results:/etc/newman/results \
            -v $(pwd)/postman:/etc/newman-host \
            postman-newman-instructor:e2e \
            run /etc/newman/fault-tolerance-collection.json \
              -e /etc/newman-host/env-after-step2.json \
              --env-var "baseUrl=http://localhost:8080" \
              --env-var "username=Test User" \
              --folder step3 \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/step3.xml

          echo "🧪 Running step4 (Bonus started again)..."
          kubectl scale -n "$NS" deployment/bonus --replicas=1
          sleep 10
          docker run --rm --network=host \
            -v $(pwd)/postman/test-results:/etc/newman/results \
            -v $(pwd)/postman:/etc/newman-host \
            postman-newman-instructor:e2e \
            run /etc/newman/fault-tolerance-collection.json \
              -e /etc/newman-host/env-after-step2.json \
              --env-var "baseUrl=http://localhost:8080" \
              --env-var "username=Test User" \
              --folder step4 \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/step4.xml

          echo "✅ Fault-tolerance tests completed"

      - name: Upload fault-tolerance test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-tolerance-junit-results
          path: postman/test-results/step*.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Publish fault-tolerance test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Fault Tolerance - Bonus Service Failover (Postman)
          path: postman/test-results/step*.xml
          reporter: java-junit

      - name: Cleanup port-forward
        if: always()
        run: |
          echo "🧹 Cleaning up port-forward..."
          kill $PORT_FWD_PID 2>/dev/null || true
          echo "✅ Cleanup complete"
