# ===========================================
# CI Pipeline - Build and Test All Microservices
# ===========================================
# Lab 02: Distributed Systems
# Services: Gateway, Flight, Ticket, Bonus

name: CI - Build and Test All Microservices

on:
  push:
    branches: [main, develop, lab_04]
  pull_request:
    branches: [main, lab_04]

# ===========================================
# Concurrency Control
# ===========================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# ===========================================
# Default Settings
# ===========================================
defaults:
  run:
    shell: bash

jobs:
  # ===========================================
  # Security: CodeQL Analysis
  # ===========================================
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: +security-and-quality

      - name: Build
        run: |
          dotnet restore services/gateway-microservice/src/gateway-microservice.slnx
          dotnet build services/gateway-microservice/src/gateway-microservice.slnx \
            --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  # ===========================================
  # Build All Microservices
  # ===========================================
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - flight
          - ticket
          - bonus
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        working-directory: services/${{ matrix.service }}-microservice/src
        run: |
          dotnet restore presentation/presentation.csproj
          dotnet restore tests/tests.csproj

      - name: Build application
        working-directory: services/${{ matrix.service }}-microservice/src
        run: |
          dotnet build presentation/presentation.csproj --no-restore --configuration Release --verbosity minimal

      - name: Analyze dependencies
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate
          allow-licenses: MIT,Apache-2.0,MIT AND Apache-2.0

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-build-artifacts
          path: services/${{ matrix.service }}-microservice/src/
          retention-days: 7

  # ===========================================
  # Unit Tests All Microservices
  # ===========================================
  unit-tests:
    name: Unit Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - flight
          - ticket
          - bonus
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-build-artifacts
          path: services/${{ matrix.service }}-microservice/src/

      - name: Run unit tests
        working-directory: services/${{ matrix.service }}-microservice/src
        run: |
          mkdir -p ./TestResults
          dotnet test tests/tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~Unit&FullyQualifiedName!~Integration" \
            --verbosity minimal \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory "$(pwd)/TestResults" \
            --collect:"XPlat Code Coverage" \
            --blame-hang \
            --blame-crash \
            2>&1 | tee test-output.log
        continue-on-error: false

      - name: Print test summary on failure
        if: failure()
        working-directory: services/${{ matrix.service }}-microservice/src
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 test-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # List all files in TestResults
          echo "\n## Test Results Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find ./TestResults -type f -name "*.trx" 2>/dev/null || echo "No .trx files found"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-unit-test-results
          path: |
            services/${{ matrix.service }}-microservice/src/TestResults/*.trx
            services/${{ matrix.service }}-microservice/src/TestResults/**/coverage.cobertura.xml
            services/${{ matrix.service }}-microservice/src/test-output.log
          retention-days: 7
          if-no-files-found: error

      - name: Check if .trx files exist
        working-directory: services/${{ matrix.service }}-microservice/src
        run: |
          echo "Looking for .trx files in ./TestResults..."
          find ./TestResults -type f -name "*.trx" -exec ls -la {} \;
          TRX_COUNT=$(find ./TestResults -type f -name "*.trx" | wc -l)
          echo "Found $TRX_COUNT .trx files"
          if [ "$TRX_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No .trx files found!"
            echo "Test output:"
            cat test-output.log
            exit 1
          fi
          echo "✅ .trx files found!"

      - name: Test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "services/${{ matrix.service }}-microservice/src/TestResults/*.trx"
          output: ${{ matrix.service }}-test-summary.md

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-test-summary
          path: ${{ matrix.service }}-test-summary.md
          retention-days: 7

      - name: Publish test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: ${{ matrix.service }} - Unit Test Results
          path: services/${{ matrix.service }}-microservice/src/TestResults/*.trx
          reporter: dotnet-trx

  # ===========================================
  # Integration Tests All Microservices (PostgreSQL only)
  # ===========================================
  # Note: Gateway has only HTTP integration tests, not PostgreSQL tests
  integration-tests:
    name: Integration Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        service:
          - flight
          - ticket
          - bonus
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: test_${{ matrix.service }}
          POSTGRES_USER: program
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10
        ports:
          # Map container port 5432 to different host ports for each service
          # This matches the TEST_POSTGRESQL_PORT_EXTERNAL values in .env files
          - 5442:5432 # gateway
          - 5462:5432 # flight
          - 5472:5432 # ticket
          - 5452:5432 # bonus

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-build-artifacts
          path: services/${{ matrix.service }}-microservice/src/

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          # Get port from environment variable or use service-specific default
          case "${{ matrix.service }}" in
            gateway) PORT=5442 ;;
            flight) PORT=5462 ;;
            ticket) PORT=5472 ;;
            bonus) PORT=5452 ;;
            *) PORT=5432 ;;
          esac
          echo "Using PostgreSQL port: $PORT"
          for i in {1..60}; do
            if PGPASSWORD=test pg_isready -h localhost -p $PORT -U program > /dev/null 2>&1; then
              echo "✅ PostgreSQL is ready on port $PORT!"
              exit 0
            fi
            echo "  Waiting for PostgreSQL... ($i/60)"
            sleep 1
          done
          echo "❌ PostgreSQL failed to start on port $PORT"
          exit 1

      - name: Create test database
        run: |
          # Get port from environment variable or use service-specific default
          case "${{ matrix.service }}" in
            gateway) PORT=5442 ;;
            flight) PORT=5462 ;;
            ticket) PORT=5472 ;;
            bonus) PORT=5452 ;;
            *) PORT=5432 ;;
          esac
          echo "Creating test database: test_${{ matrix.service }} on port $PORT"
          PGPASSWORD=test psql -h localhost -p $PORT -U program -d postgres -c "DROP DATABASE IF EXISTS test_${{ matrix.service }};" 2>/dev/null || true
          PGPASSWORD=test psql -h localhost -p $PORT -U program -d postgres -c "CREATE DATABASE test_${{ matrix.service }};"
          echo "✅ Database created!"

      - name: Run integration tests (PostgreSQL only)
        working-directory: services/${{ matrix.service }}-microservice/src
        run: |
          mkdir -p ./TestResults
          dotnet test tests/tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~Integration&FullyQualifiedName~postgres&FullyQualifiedName!~http" \
            --verbosity minimal \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            2>&1 | tee test-output.log
        env:
          TEST_DATABASE_PROVIDER: POSTGRESQL
          TEST_POSTGRESQL_HOST: localhost
          # Port is already set in .env file, but we can override if needed
          TEST_POSTGRESQL_PORT: ${{ matrix.service == 'gateway' && '5442' || matrix.service == 'flight' && '5462' || matrix.service == 'ticket' && '5472' || matrix.service == 'bonus' && '5452' || '5432' }}
          TEST_POSTGRESQL_DATABASE: test_${{ matrix.service }}
          TEST_POSTGRESQL_USER: program
          TEST_POSTGRESQL_PASSWORD: test

      - name: Print test summary on failure
        if: failure()
        working-directory: services/${{ matrix.service }}-microservice/src
        run: |
          echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 test-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-integration-test-results
          path: |
            services/${{ matrix.service }}-microservice/src/TestResults/*.trx
            services/${{ matrix.service }}-microservice/src/TestResults/**/coverage.cobertura.xml
            services/${{ matrix.service }}-microservice/src/test-output.log
          retention-days: 7
          if-no-files-found: warn

      - name: Test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "services/${{ matrix.service }}-microservice/src/TestResults/*.trx"
          output: ${{ matrix.service }}-integration-summary.md

      - name: Upload integration test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-integration-summary
          path: ${{ matrix.service }}-integration-summary.md
          retention-days: 7

      - name: Publish integration test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: ${{ matrix.service }} - Integration Test Results
          path: services/${{ matrix.service }}-microservice/src/TestResults/*.trx
          reporter: dotnet-trx

  # ===========================================
  # Integration Tests - Gateway (HTTP with all services)
  # ===========================================
  # Gateway HTTP integration tests require all microservices to be running
  # This job builds and starts bonus, flight, ticket services + Gateway
  integration-tests-gateway:
    name: Integration Tests gateway
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Gateway build artifacts
        uses: actions/download-artifact@v4
        with:
          name: gateway-build-artifacts
          path: services/gateway-microservice/src/

      - name: Build all microservices for integration tests
        working-directory: services/gateway-microservice
        run: |
          echo "Building bonus, flight, ticket microservices..."
          # Build only bonus, flight, ticket services (not gateway yet)
          docker compose -f docker-compose.integration-tests.yml build bonus-api flight-api ticket-api

      - name: Start bonus, flight, ticket services (no health checks)
        working-directory: services/gateway-microservice
        run: |
          echo "Starting bonus, flight, ticket services..."
          # Start only bonus, flight, ticket services (no gateway, no health check dependencies)
          docker compose -f docker-compose.integration-tests.yml up -d bonus-postgres flight-postgres ticket-postgres bonus-redis
          docker compose -f docker-compose.integration-tests.yml up -d bonus-api flight-api ticket-api
          echo "Waiting for services to be ready..."
          sleep 15

      - name: Wait for Bonus service
        run: |
          echo "Waiting for Bonus service..."
          for i in {1..30}; do
            if curl -sf http://localhost:8053/manage/health > /dev/null 2>&1; then
              echo "✅ Bonus service is ready!"
              exit 0
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done
          echo "❌ Bonus service failed to start"
          docker compose -f services/gateway-microservice/docker-compose.integration-tests.yml logs bonus-api
          exit 1

      - name: Wait for Flight service
        run: |
          echo "Waiting for Flight service..."
          for i in {1..30}; do
            if curl -sf http://localhost:8063/manage/health > /dev/null 2>&1; then
              echo "✅ Flight service is ready!"
              exit 0
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done
          echo "❌ Flight service failed to start"
          docker compose -f services/gateway-microservice/docker-compose.integration-tests.yml logs flight-api
          exit 1

      - name: Wait for Ticket service
        run: |
          echo "Waiting for Ticket service..."
          for i in {1..30}; do
            if curl -sf http://localhost:8073/manage/health > /dev/null 2>&1; then
              echo "✅ Ticket service is ready!"
              exit 0
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done
          echo "❌ Ticket service failed to start"
          docker compose -f services/gateway-microservice/docker-compose.integration-tests.yml logs ticket-api
          exit 1

      - name: Build and start Gateway service
        working-directory: services/gateway-microservice
        run: |
          echo "Building and starting Gateway service..."
          docker compose -f docker-compose.integration-tests.yml build gateway-api
          docker compose -f docker-compose.integration-tests.yml up -d gateway-api
          sleep 10

      - name: Run HTTP integration tests
        working-directory: services/gateway-microservice/src
        run: |
          mkdir -p ./TestResults
          dotnet test tests/tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~Integration&FullyQualifiedName~http" \
            --verbosity minimal \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory ./TestResults \
            2>&1 | tee test-output.log
        env:
          ASPNETCORE_ENVIRONMENT: Test
          GATEWAY_URL: http://localhost:8083

      - name: Print test summary on failure
        if: failure()
        working-directory: services/gateway-microservice/src
        run: |
          echo "## Gateway Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 test-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "\n\nDocker Logs:" >> $GITHUB_STEP_SUMMARY
          docker compose -f ../docker-compose.integration-tests.yml logs >> $GITHUB_STEP_SUMMARY

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-integration-test-results
          path: |
            services/gateway-microservice/src/TestResults/*.trx
            services/gateway-microservice/src/test-output.log
          retention-days: 7
          if-no-files-found: warn

      - name: Test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "services/gateway-microservice/src/TestResults/*.trx"
          output: gateway-integration-summary.md

      - name: Upload integration test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-integration-summary
          path: gateway-integration-summary.md
          retention-days: 7

      - name: Publish integration test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Gateway - Integration Test Results (HTTP)
          path: services/gateway-microservice/src/TestResults/*.trx
          reporter: dotnet-trx

      - name: Wait for Gateway service
        run: |
          echo "Waiting for Gateway service..."
          for i in {1..30}; do
            if curl -sf http://localhost:8083/manage/health > /dev/null 2>&1; then
              echo "✅ Gateway service is ready!"
              exit 0
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done
          echo "❌ Gateway service failed to start"
          docker compose -f services/gateway-microservice/docker-compose.integration-tests.yml logs gateway-api
          exit 1

      - name: Stop and cleanup services
        if: always()
        working-directory: services/gateway-microservice
        run: |
          echo "Stopping all services..."
          docker compose -f docker-compose.integration-tests.yml down -v
          echo "Cleanup complete."

  # ===========================================
  # Docker Build Test All Microservices
  # ===========================================
  docker-test:
    name: Docker Build Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - flight
          - ticket
          - bonus
    
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-build-artifacts
          path: services/${{ matrix.service }}-microservice/src/

      - name: Build Docker image (test)
        id: docker-build
        working-directory: services/${{ matrix.service }}-microservice
        run: |
          docker build \
            --tag ${{ matrix.service }}-microservice:test \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VERSION=${{ github.sha }} \
            --progress=plain \
            .
          echo "image=${{ matrix.service }}-microservice:test" >> $GITHUB_OUTPUT

      - name: Test Docker image
        run: |
          # Get correct port for each service
          case "${{ matrix.service }}" in
            bonus) PORT=8050 ;;
            flight) PORT=8060 ;;
            ticket) PORT=8070 ;;
            gateway) PORT=8080 ;;
            *) PORT=8080 ;;
          esac
          
          docker run -d --name ${{ matrix.service }}-test -p $PORT:$PORT ${{ matrix.service }}-microservice:test
          sleep 10
          for i in {1..30}; do
            if curl -sf http://localhost:$PORT/manage/health > /dev/null 2>&1; then
              echo "✅ Application is responding on port $PORT!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Application failed to start"
              docker logs ${{ matrix.service }}-test
              docker rm -f ${{ matrix.service }}-test
              exit 1
            fi
            sleep 2
          done
          docker rm -f ${{ matrix.service }}-test

      - name: Check Docker image size
        run: |
          SIZE=$(docker images ${{ matrix.service }}-microservice:test --format "{{.Size}}")
          echo "Docker image size: $SIZE"

      - name: Run Docker security scan
        uses: aquasecurity/trivy-action@master
        if: github.event_name == 'pull_request'
        with:
          image-ref: '${{ matrix.service }}-microservice:test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ===========================================
  # API Tests - Postman Newman
  # ===========================================
  # ===========================================
  # API Tests - Postman Newman (Docker)
  # ===========================================
  api-tests:
    name: API Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - integration-tests-gateway
    strategy:
      fail-fast: false
      matrix:
        service:
          - flight
          - ticket
          - bonus

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-build-artifacts
          path: services/${{ matrix.service }}-microservice/src/

      - name: Build Postman Newman image
        run: |
          echo "Building Postman Newman image for ${{ matrix.service }}..."
          docker build \
            --tag postman-newman-${{ matrix.service }}:e2e \
            -f services/${{ matrix.service }}-microservice/postman/Dockerfile \
            services/${{ matrix.service }}-microservice/postman/
          echo "✅ Postman Newman image built: postman-newman-${{ matrix.service }}:e2e"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start PostgreSQL container
        run: |
          docker rm -f postgres-${{ matrix.service }}-tests 2>/dev/null || true
          docker network rm ${{ matrix.service }}-test-network 2>/dev/null || true
          docker network create ${{ matrix.service }}-test-network
          docker run -d \
            --name postgres-${{ matrix.service }}-tests \
            --network ${{ matrix.service }}-test-network \
            -e POSTGRES_DB=test_api \
            -e POSTGRES_USER=program \
            -e POSTGRES_PASSWORD=test \
            -p 5432:5432 \
            postgres:14-alpine
          echo "⏳ Waiting for PostgreSQL to start..."
          sleep 5

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U program; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✅ PostgreSQL is ready"

      - name: Build and start microservice
        working-directory: services/${{ matrix.service }}-microservice
        run: |
          case "${{ matrix.service }}" in
            bonus) PORT=8050 ;;
            flight) PORT=8060 ;;
            ticket) PORT=8070 ;;
            gateway) PORT=8080 ;;
            *) PORT=8080 ;;
          esac
          docker build -t ${{ matrix.service }}-microservice:api .
          docker run -d \
            --name ${{ matrix.service }}-api-e2e \
            --network ${{ matrix.service }}-test-network \
            --link postgres-${{ matrix.service }}-tests:postgres \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e POSTGRESQL_HOST=postgres \
            -e POSTGRESQL_PORT=5432 \
            -e POSTGRESQL_DATABASE=test_api \
            -e POSTGRESQL_USER=program \
            -e POSTGRESQL_PASSWORD=test \
            -e APP_PORT=$PORT \
            -p $PORT:$PORT \
            -e OIDC_TEST_SECRET="ThisIsATestSecretKeyForIntegrationTests1234567890" \
            ${{ matrix.service }}-microservice:api
          echo "⏳ Waiting for API to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:$PORT/manage/health > /dev/null 2>&1; then
              echo "✅ API is ready on port $PORT!"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done

      - name: Apply database migrations
        if: ${{ matrix.service != 'gateway' }}
        working-directory: services/${{ matrix.service }}-microservice
        run: |
          echo "Applying EF Core migrations..."
          docker exec ${{ matrix.service }}-api-e2e dotnet ef database update --project src/dataaccess/dataaccess.csproj --startup-project src/presentation/presentation.csproj || true
          echo "✅ Migrations applied"

      - name: Run Postman API tests
        run: |
          case "${{ matrix.service }}" in
            bonus) PORT=8050 ;;
            flight) PORT=8060 ;;
            ticket) PORT=8070 ;;
            gateway) PORT=8080 ;;
            *) PORT=8080 ;;
          esac
          mkdir -p services/${{ matrix.service }}-microservice/postman/test-results
          docker run --rm \
            --network ${{ matrix.service }}-test-network \
            -e BASE_URL=http://${{ matrix.service }}-api-e2e:$PORT \
            -v $(pwd)/services/${{ matrix.service }}-microservice/postman/test-results:/etc/newman/results \
            postman-newman-${{ matrix.service }}:e2e

      - name: Upload API test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-api-tests-junit-results
          path: |
            services/${{ matrix.service }}-microservice/postman/test-results/results.xml
          retention-days: 7
          if-no-files-found: error

      - name: Publish API test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: ${{ matrix.service }} - API Test Results (Postman)
          path: services/${{ matrix.service }}-microservice/postman/test-results/results.xml
          reporter: java-junit

      - name: Cleanup Docker containers
        if: always()
        run: |
          echo "🧹 Cleaning up Docker containers..."
          docker rm -f ${{ matrix.service }}-api-e2e postgres-${{ matrix.service }}-tests 2>/dev/null || true
          docker network rm ${{ matrix.service }}-test-network 2>/dev/null || true
          echo "✅ Cleanup complete"

  # ===========================================
  # Gateway API Tests (requires all services)
  # ===========================================
  gateway-api-tests:
    name: API Tests gateway
    runs-on: ubuntu-latest
    needs: integration-tests-gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: gateway-build-artifacts
          path: services/gateway-microservice/src/

      - name: Build Postman Newman image for Gateway
        run: |
          echo "Building Postman Newman image for Gateway..."
          docker build \
            --tag postman-newman-gateway:e2e \
            -f services/gateway-microservice/postman/Dockerfile \
            services/gateway-microservice/postman/
          echo "✅ Postman Newman image built: postman-newman-gateway:e2e"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start PostgreSQL containers
        run: |
          echo "Starting PostgreSQL containers for all services..."
          docker network create gateway-test-network
          
          docker run -d --name postgres-bonus-tests --network gateway-test-network -e POSTGRES_DB=test_api -e POSTGRES_USER=program -e POSTGRES_PASSWORD=test postgres:14-alpine
          docker run -d --name postgres-flight-tests --network gateway-test-network -e POSTGRES_DB=test_api -e POSTGRES_USER=program -e POSTGRES_PASSWORD=test postgres:14-alpine
          docker run -d --name postgres-ticket-tests --network gateway-test-network -e POSTGRES_DB=test_api -e POSTGRES_USER=program -e POSTGRES_PASSWORD=test postgres:14-alpine
          
          echo "⏳ Waiting for PostgreSQL instances..."
          sleep 5

      - name: Build all microservices
        run: |
          echo "Building bonus, flight, ticket, gateway microservices..."
          docker build -t bonus-microservice:api services/bonus-microservice/
          docker build -t flight-microservice:api services/flight-microservice/
          docker build -t ticket-microservice:api services/ticket-microservice/
          docker build -t gateway-microservice:api services/gateway-microservice/
          echo "✅ All microservices built"

      - name: Start backend services
        run: |
          echo "Starting bonus, flight, ticket services..."
          
          docker run -d --name bonus-api-e2e --network gateway-test-network --link postgres-bonus-tests:postgres -e ASPNETCORE_ENVIRONMENT=Development -e POSTGRESQL_HOST=postgres -e POSTGRESQL_PORT=5432 -e POSTGRESQL_DATABASE=test_api -e POSTGRESQL_USER=program -e POSTGRESQL_PASSWORD=test -e APP_PORT=8050 -p 8050:8050 -e OIDC_TEST_SECRET="ThisIsATestSecretKeyForIntegrationTests1234567890" bonus-microservice:api
          docker run -d --name flight-api-e2e --network gateway-test-network --link postgres-flight-tests:postgres -e ASPNETCORE_ENVIRONMENT=Development -e POSTGRESQL_HOST=postgres -e POSTGRESQL_PORT=5432 -e POSTGRESQL_DATABASE=test_api -e POSTGRESQL_USER=program -e POSTGRESQL_PASSWORD=test -e APP_PORT=8060 -p 8060:8060 -e OIDC_TEST_SECRET="ThisIsATestSecretKeyForIntegrationTests1234567890" flight-microservice:api
          docker run -d --name ticket-api-e2e --network gateway-test-network --link postgres-ticket-tests:postgres -e ASPNETCORE_ENVIRONMENT=Development -e POSTGRESQL_HOST=postgres -e POSTGRESQL_PORT=5432 -e POSTGRESQL_DATABASE=test_api -e POSTGRESQL_USER=program -e POSTGRESQL_PASSWORD=test -e APP_PORT=8070 -p 8070:8070 -e OIDC_TEST_SECRET="ThisIsATestSecretKeyForIntegrationTests1234567890" ticket-microservice:api
          
          echo "⏳ Waiting for backend services to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:8050/manage/health > /dev/null 2>&1 && curl -sf http://localhost:8060/manage/health > /dev/null 2>&1 && curl -sf http://localhost:8070/manage/health > /dev/null 2>&1; then
              echo "✅ All backend services ready!"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done

      - name: Apply database migrations
        run: |
          echo "Applying EF Core migrations to all services..."
          docker exec bonus-api-e2e dotnet ef database update --project src/dataaccess/dataaccess.csproj --startup-project src/presentation/presentation.csproj || true
          docker exec flight-api-e2e dotnet ef database update --project src/dataaccess/dataaccess.csproj --startup-project src/presentation/presentation.csproj || true
          docker exec ticket-api-e2e dotnet ef database update --project src/dataaccess/dataaccess.csproj --startup-project src/presentation/presentation.csproj || true
          echo "✅ Migrations applied"

      - name: Seed database
        run: |
          echo "Seeding database..."
          
          # Flight DB: airports + flights
          docker exec -i postgres-flight-tests psql -U program -d test_api << 'SQL'
          INSERT INTO airports (id, name, city, country)
          VALUES (1, 'Шереметьево', 'Москва', 'Россия'),
                 (2, 'Пулково', 'Санкт-Петербург', 'Россия'),
                 (7, 'Tokyo Narita', 'Tokyo', 'Japan')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO flights (id, flight_uid, flight_number, datetime, from_airport_id, to_airport_id, price)
          VALUES (1, 'a1b2c3d4-e5f6-7890-abcd-ef1234567890', 'AFL031', '2021-10-08 20:00', 2, 1, 1500)
          ON CONFLICT (id) DO NOTHING;

          SELECT setval(pg_get_serial_sequence('airports','id'), (SELECT MAX(id) FROM airports));
          SELECT setval(pg_get_serial_sequence('flights','id'), (SELECT MAX(id) FROM flights));
          SQL

          # Bonus DB: privilege for testuser
          docker exec -i postgres-bonus-tests psql -U program -d test_api << 'SQL'
          INSERT INTO privilege (id, username, status, balance)
          VALUES (1, 'testuser', 0, 10000)
          ON CONFLICT (username) DO NOTHING;
          SQL

          echo "✅ Database seeded"

      - name: Start Gateway service
        run: |
          echo "Starting Gateway service..."
          
          # Wait for downstream services to be ready
          echo "⏳ Waiting for downstream services..."
          for svc in bonus-api-e2e:8050 flight-api-e2e:8060 ticket-api-e2e:8070; do
            for i in {1..30}; do
              if curl -sf http://$svc/manage/health > /dev/null 2>&1; then
                echo "✅ $svc ready!"
                break
              fi
              echo "  Waiting for $svc... ($i/30)"
              sleep 2
            done
          done
          
          docker run -d --name gateway-api-e2e --network gateway-test-network -e ASPNETCORE_ENVIRONMENT=Development -e APP_PORT=8080 -e BONUS_API_URL=http://bonus-api-e2e:8050 -e FLIGHT_API_URL=http://flight-api-e2e:8060 -e TICKET_API_URL=http://ticket-api-e2e:8070 -p 8080:8080 -e OIDC_TEST_SECRET="ThisIsATestSecretKeyForIntegrationTests1234567890" gateway-microservice:api
          
          echo "⏳ Waiting for Gateway to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/manage/health > /dev/null 2>&1; then
              echo "✅ Gateway ready!"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done

      - name: Run Gateway Postman API tests
        run: |
          echo "Running Gateway API tests..."
          
          # Generate JWT token
          BEARER_TOKEN=$(python3 << 'PY'
          import hmac, hashlib, base64, json, time
          secret = b'ThisIsATestSecretKeyForIntegrationTests1234567890'
          header = {'alg':'HS256','typ':'JWT'}
          now = int(time.time())
          payload = {
              'sub':'testuser',
              'preferred_username':'testuser',
              'iss':'test',
              'aud':'gateway',
              'iat':now,
              'exp':now+3600
          }
          def b64u(b): return base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          h = b64u(json.dumps(header,separators=(',',':')).encode())
          p = b64u(json.dumps(payload,separators=(',',':')).encode())
          sig = b64u(hmac.new(secret, f'{h}.{p}'.encode(), hashlib.sha256).digest())
          print(f'{h}.{p}.{sig}')
          PY
          )
          
          mkdir -p services/gateway-microservice/postman/test-results
          docker run --rm \
            --network gateway-test-network \
            -e BASE_URL=http://gateway-api-e2e:8080 \
            -e BEARER_TOKEN="$BEARER_TOKEN" \
            -v $(pwd)/services/gateway-microservice/postman/test-results:/etc/newman/results \
            postman-newman-gateway:e2e

      - name: Upload Gateway API test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-api-tests-junit-results
          path: |
            services/gateway-microservice/postman/test-results/results.xml
          retention-days: 7
          if-no-files-found: error

      - name: Publish Gateway API test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Gateway - API Test Results (Postman)
          path: services/gateway-microservice/postman/test-results/results.xml
          reporter: java-junit

      - name: Cleanup Docker containers
        if: always()
        run: |
          echo "🧹 Cleaning up Docker containers..."
          docker rm -f gateway-api-e2e bonus-api-e2e flight-api-e2e ticket-api-e2e \
            postgres-bonus-tests postgres-flight-tests postgres-ticket-tests 2>/dev/null || true
          docker network rm gateway-test-network 2>/dev/null || true
          echo "✅ Cleanup complete"

  # ===========================================
  # Autograding (Instructor Postman Tests)
  # ===========================================
  # Runs after all service API tests pass
  # Keycloak 26.0 + full stack with real OIDC (NO test mode)
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    needs:
      - gateway-api-tests
      - api-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build all microservices
        run: |
          echo "Building bonus, flight, ticket, gateway microservices..."
          docker build -t bonus-microservice:api services/bonus-microservice/
          docker build -t flight-microservice:api services/flight-microservice/
          docker build -t ticket-microservice:api services/ticket-microservice/
          docker build -t gateway-microservice:api services/gateway-microservice/
          echo "✅ All microservices built"

      - name: Start PostgreSQL containers (host network)
        run: |
          echo "Starting PostgreSQL containers on host network..."
          docker run -d --name postgres-bonus-tests --network host \
            -e POSTGRES_DB=test_api -e POSTGRES_USER=program -e POSTGRES_PASSWORD=test \
            -e PGPORT=5435 postgres:14-alpine
          docker run -d --name postgres-flight-tests --network host \
            -e POSTGRES_DB=test_api -e POSTGRES_USER=program -e POSTGRES_PASSWORD=test \
            -e PGPORT=5433 postgres:14-alpine
          docker run -d --name postgres-ticket-tests --network host \
            -e POSTGRES_DB=test_api -e POSTGRES_USER=program -e POSTGRES_PASSWORD=test \
            -e PGPORT=5434 postgres:14-alpine
          
          echo "⏳ Waiting for PostgreSQL instances..."
          for p in 5433 5434 5435; do
            for i in {1..30}; do
              docker run --rm --network host postgres:14-alpine pg_isready -h localhost -p $p -U program && break
              echo "  Waiting PostgreSQL $p... ($i/30)"
              sleep 2
            done
          done

      - name: Start Keycloak with imported realm
        run: |
          echo "Starting Keycloak 26.0 with realm-rsoi.json..."
          docker run -d --name keycloak --network host \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -e KC_HOSTNAME=http://localhost:8888 \
            -e KC_HTTP_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            -v "$(pwd)/deploy/k8s/keycloak/realm-rsoi.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.0 \
            start-dev --import-realm --http-port=8888

          echo "⏳ Waiting for Keycloak realm rsoi to be ready..."
          for i in {1..60}; do
            if curl -sf http://localhost:8888/realms/rsoi/.well-known/openid-configuration > /dev/null 2>&1; then
              echo "✅ Keycloak ready"
              break
            fi
            echo "  Waiting Keycloak... ($i/60)"
            sleep 2
          done
          echo "--- Keycloak logs (last 50 lines) ---"
          docker logs keycloak 2>&1 | tail -50

      - name: Start downstream services (real Keycloak mode, NO test secret)
        run: |
          echo "Starting bonus, flight, ticket services with Keycloak OIDC..."
          
          docker run -d --name bonus-api-e2e --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e POSTGRESQL_HOST=localhost -e POSTGRESQL_PORT=5435 \
            -e POSTGRESQL_DATABASE=test_api -e POSTGRESQL_USER=program \
            -e POSTGRESQL_PASSWORD=test -e APP_PORT=8050 \
            -e OIDC_ISSUER=http://localhost:8888/realms/rsoi \
            -e OIDC_JWKS_URI=http://localhost:8888/realms/rsoi/protocol/openid-connect/certs \
            -e OIDC_CLIENT_ID=gateway \
            -e OIDC_CLIENT_SECRET=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj \
            bonus-microservice:api

          docker run -d --name flight-api-e2e --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e POSTGRESQL_HOST=localhost -e POSTGRESQL_PORT=5433 \
            -e POSTGRESQL_DATABASE=test_api -e POSTGRESQL_USER=program \
            -e POSTGRESQL_PASSWORD=test -e APP_PORT=8060 \
            -e OIDC_ISSUER=http://localhost:8888/realms/rsoi \
            -e OIDC_JWKS_URI=http://localhost:8888/realms/rsoi/protocol/openid-connect/certs \
            -e OIDC_CLIENT_ID=gateway \
            -e OIDC_CLIENT_SECRET=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj \
            flight-microservice:api

          docker run -d --name ticket-api-e2e --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e POSTGRESQL_HOST=localhost -e POSTGRESQL_PORT=5434 \
            -e POSTGRESQL_DATABASE=test_api -e POSTGRESQL_USER=program \
            -e POSTGRESQL_PASSWORD=test -e APP_PORT=8070 \
            -e OIDC_ISSUER=http://localhost:8888/realms/rsoi \
            -e OIDC_JWKS_URI=http://localhost:8888/realms/rsoi/protocol/openid-connect/certs \
            -e OIDC_CLIENT_ID=gateway \
            -e OIDC_CLIENT_SECRET=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj \
            ticket-microservice:api

          echo "⏳ Waiting for backend services to start..."
          for port in 8050 8060 8070; do
            for i in {1..30}; do
              if curl -sf http://localhost:$port/manage/health > /dev/null 2>&1; then
                echo "✅ Port $port ready"
                break
              fi
              echo "  Waiting $port... ($i/30)"
              sleep 2
            done
          done

      - name: Seed flight and bonus data for autograding
        run: |
          set -e
          echo "Seeding airports and flight for autograding tests..."
          sudo apt-get update && sudo apt-get install -y postgresql-client
          
          PGPASSWORD=test psql -h localhost -p 5433 -U program -d test_api <<'SQL'
          INSERT INTO airports (id, name, city, country) VALUES
            (1, 'Шереметьево', 'Москва', 'Россия'),
            (2, 'Пулково', 'Санкт-Петербург', 'Россия'),
            (7, 'Tokyo Narita', 'Tokyo', 'Japan')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO flights (id, flight_uid, flight_number, datetime, from_airport_id, to_airport_id, price)
          VALUES (1, 'a1b2c3d4-e5f6-7890-abcd-ef1234567890', 'AFL031', '2021-10-08 20:00:00+00', 2, 1, 1500)
          ON CONFLICT (id) DO NOTHING;

          SELECT setval(pg_get_serial_sequence('airports','id'), (SELECT MAX(id) FROM airports));
          SELECT setval(pg_get_serial_sequence('flights','id'), (SELECT MAX(id) FROM flights));
          SQL

          echo "Verifying flight seed..."
          PGPASSWORD=test psql -h localhost -p 5433 -U program -d test_api -tAc "SELECT COUNT(*) FROM flights WHERE flight_number='AFL031';"

          echo "Seeding privilege for testuser in bonus DB..."
          PGPASSWORD=test psql -h localhost -p 5435 -U program -d test_api <<'SQL'
          INSERT INTO privilege (id, username, status, balance) VALUES (1, 'testuser', 0, 10000)
          ON CONFLICT (username) DO NOTHING;
          SQL

          echo "Verifying privilege seed..."
          PGPASSWORD=test psql -h localhost -p 5435 -U program -d test_api -tAc "SELECT COUNT(*) FROM privilege WHERE username='testuser';"

          echo "✅ Seed applied successfully"

      - name: Start Gateway service (real Keycloak mode, NO test secret)
        run: |
          echo "Starting Gateway service with Keycloak OIDC..."
          docker run -d --name gateway-api-e2e --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e APP_PORT=8080 \
            -e BONUS_API_URL=http://localhost:8050 \
            -e FLIGHT_API_URL=http://localhost:8060 \
            -e TICKET_API_URL=http://localhost:8070 \
            -e OIDC_ISSUER=http://localhost:8888/realms/rsoi \
            -e OIDC_JWKS_URI=http://localhost:8888/realms/rsoi/protocol/openid-connect/certs \
            -e OIDC_CLIENT_ID=gateway \
            -e OIDC_CLIENT_SECRET=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj \
            gateway-microservice:api
          
          echo "⏳ Waiting for Gateway to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/manage/health > /dev/null 2>&1; then
              echo "✅ Gateway ready!"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done
          echo "--- Gateway env check ---"
          docker exec gateway-api-e2e env | grep -E "OIDC|BONUS|FLIGHT|TICKET" | sort

      - name: Build Newman instructor image
        run: |
          echo "Building Postman Newman image for Instructor Tests..."
          docker build \
            --tag postman-newman-instructor:e2e \
            -f postman/Dockerfile \
            postman/
          echo "✅ Postman Newman image built: postman-newman-instructor:e2e"

      - name: Run autograding (instructor) Postman tests
        run: |
          echo "Running instructor API tests via Gateway..."
          mkdir -p postman/test-results
          docker run --rm \
            --network host \
            -v "$(pwd)/postman/test-results:/etc/newman/results" \
            postman-newman-instructor:e2e \
            run /etc/newman/collection.json \
              -e /etc/newman/environment.json \
              --env-var "identityProviderUrl=http://localhost:8888/realms/rsoi" \
              --env-var "serviceUrl=http://localhost:8080" \
              --env-var "clientId=gateway" \
              --env-var "clientSecret=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj" \
              --env-var "username=testuser" \
              --env-var "password=test" \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/results.xml

      - name: Upload Autograding test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instructor-api-tests-junit-results
          path: |
            postman/test-results/results.xml
          retention-days: 7
          if-no-files-found: error

      - name: Publish Autograding test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Autograding - Instructor Tests (Postman)
          path: postman/test-results/results.xml
          reporter: java-junit

      - name: Debug — Keycloak logs (on failure)
        if: failure()
        run: |
          echo "=== Keycloak logs (last 100 lines) ==="
          docker logs keycloak 2>&1 | tail -100

      - name: Debug — Gateway logs (on failure)
        if: failure()
        run: |
          echo "=== Gateway logs (last 100 lines) ==="
          docker logs gateway-api-e2e 2>&1 | tail -100

      - name: Cleanup Docker containers
        if: always()
        run: |
          echo "🧹 Cleaning up Docker containers..."
          docker rm -f gateway-api-e2e bonus-api-e2e flight-api-e2e ticket-api-e2e \
            postgres-bonus-tests postgres-flight-tests postgres-ticket-tests keycloak 2>/dev/null || true
          echo "✅ Cleanup complete"

  # ===========================================
  # Fault Tolerance Tests
  # ===========================================
  # Same infrastructure as Autograding (Keycloak + full stack)
  # Bonus Service stop/start via docker (not kubectl)
  fault-tolerance:
    name: Fault Tolerance
    runs-on: ubuntu-latest
    needs: autograding

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build all microservices
        run: |
          echo "Building bonus, flight, ticket, gateway microservices..."
          docker build -t bonus-microservice:api services/bonus-microservice/
          docker build -t flight-microservice:api services/flight-microservice/
          docker build -t ticket-microservice:api services/ticket-microservice/
          docker build -t gateway-microservice:api services/gateway-microservice/
          echo "✅ All microservices built"

      - name: Start PostgreSQL containers (host network)
        run: |
          echo "Starting PostgreSQL containers on host network..."
          docker run -d --name postgres-bonus-tests --network host \
            -e POSTGRES_DB=test_api -e POSTGRES_USER=program -e POSTGRES_PASSWORD=test \
            -e PGPORT=5435 postgres:14-alpine
          docker run -d --name postgres-flight-tests --network host \
            -e POSTGRES_DB=test_api -e POSTGRES_USER=program -e POSTGRES_PASSWORD=test \
            -e PGPORT=5433 postgres:14-alpine
          docker run -d --name postgres-ticket-tests --network host \
            -e POSTGRES_DB=test_api -e POSTGRES_USER=program -e POSTGRES_PASSWORD=test \
            -e PGPORT=5434 postgres:14-alpine
          
          echo "⏳ Waiting for PostgreSQL instances..."
          for p in 5433 5434 5435; do
            for i in {1..30}; do
              docker run --rm --network host postgres:14-alpine pg_isready -h localhost -p $p -U program && break
              echo "  Waiting PostgreSQL $p... ($i/30)"
              sleep 2
            done
          done

      - name: Start Keycloak with imported realm
        run: |
          echo "Starting Keycloak 26.0 with realm-rsoi.json..."
          docker run -d --name keycloak --network host \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -e KC_HOSTNAME=http://localhost:8888 \
            -e KC_HTTP_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            -v "$(pwd)/deploy/k8s/keycloak/realm-rsoi.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.0 \
            start-dev --import-realm --http-port=8888

          echo "⏳ Waiting for Keycloak realm rsoi to be ready..."
          for i in {1..60}; do
            if curl -sf http://localhost:8888/realms/rsoi/.well-known/openid-configuration > /dev/null 2>&1; then
              echo "✅ Keycloak ready"
              break
            fi
            echo "  Waiting Keycloak... ($i/60)"
            sleep 2
          done
          echo "--- Keycloak logs (last 50 lines) ---"
          docker logs keycloak 2>&1 | tail -50

      - name: Start downstream services (real Keycloak mode, NO test secret)
        run: |
          echo "Starting bonus, flight, ticket services with Keycloak OIDC..."
          
          docker run -d --name bonus-api-e2e --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e POSTGRESQL_HOST=localhost -e POSTGRESQL_PORT=5435 \
            -e POSTGRESQL_DATABASE=test_api -e POSTGRESQL_USER=program \
            -e POSTGRESQL_PASSWORD=test -e APP_PORT=8050 \
            -e OIDC_ISSUER=http://localhost:8888/realms/rsoi \
            -e OIDC_JWKS_URI=http://localhost:8888/realms/rsoi/protocol/openid-connect/certs \
            -e OIDC_CLIENT_ID=gateway \
            -e OIDC_CLIENT_SECRET=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj \
            bonus-microservice:api

          docker run -d --name flight-api-e2e --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e POSTGRESQL_HOST=localhost -e POSTGRESQL_PORT=5433 \
            -e POSTGRESQL_DATABASE=test_api -e POSTGRESQL_USER=program \
            -e POSTGRESQL_PASSWORD=test -e APP_PORT=8060 \
            -e OIDC_ISSUER=http://localhost:8888/realms/rsoi \
            -e OIDC_JWKS_URI=http://localhost:8888/realms/rsoi/protocol/openid-connect/certs \
            -e OIDC_CLIENT_ID=gateway \
            -e OIDC_CLIENT_SECRET=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj \
            flight-microservice:api

          docker run -d --name ticket-api-e2e --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e POSTGRESQL_HOST=localhost -e POSTGRESQL_PORT=5434 \
            -e POSTGRESQL_DATABASE=test_api -e POSTGRESQL_USER=program \
            -e POSTGRESQL_PASSWORD=test -e APP_PORT=8070 \
            -e OIDC_ISSUER=http://localhost:8888/realms/rsoi \
            -e OIDC_JWKS_URI=http://localhost:8888/realms/rsoi/protocol/openid-connect/certs \
            -e OIDC_CLIENT_ID=gateway \
            -e OIDC_CLIENT_SECRET=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj \
            ticket-microservice:api

          echo "⏳ Waiting for backend services to start..."
          for port in 8050 8060 8070; do
            for i in {1..30}; do
              if curl -sf http://localhost:$port/manage/health > /dev/null 2>&1; then
                echo "✅ Port $port ready"
                break
              fi
              echo "  Waiting $port... ($i/30)"
              sleep 2
            done
          done

      - name: Seed flight and bonus data for fault-tolerance
        run: |
          set -e
          echo "Seeding airports and flight for fault-tolerance tests..."
          sudo apt-get update && sudo apt-get install -y postgresql-client
          
          PGPASSWORD=test psql -h localhost -p 5433 -U program -d test_api <<'SQL'
          INSERT INTO airports (id, name, city, country) VALUES
            (1, 'Шереметьево', 'Москва', 'Россия'),
            (2, 'Пулково', 'Санкт-Петербург', 'Россия'),
            (7, 'Tokyo Narita', 'Tokyo', 'Japan')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO flights (id, flight_uid, flight_number, datetime, from_airport_id, to_airport_id, price)
          VALUES (1, 'a1b2c3d4-e5f6-7890-abcd-ef1234567890', 'AFL031', '2021-10-08 20:00:00+00', 2, 1, 1500)
          ON CONFLICT (id) DO NOTHING;

          SELECT setval(pg_get_serial_sequence('airports','id'), (SELECT MAX(id) FROM airports));
          SELECT setval(pg_get_serial_sequence('flights','id'), (SELECT MAX(id) FROM flights));
          SQL

          echo "Verifying flight seed..."
          PGPASSWORD=test psql -h localhost -p 5433 -U program -d test_api -tAc "SELECT COUNT(*) FROM flights WHERE flight_number='AFL031';"

          echo "Seeding privilege for testuser in bonus DB..."
          PGPASSWORD=test psql -h localhost -p 5435 -U program -d test_api <<'SQL'
          INSERT INTO privilege (id, username, status, balance) VALUES (1, 'testuser', 0, 10000)
          ON CONFLICT (username) DO NOTHING;
          SQL

          echo "Verifying privilege seed..."
          PGPASSWORD=test psql -h localhost -p 5435 -U program -d test_api -tAc "SELECT COUNT(*) FROM privilege WHERE username='testuser';"

          echo "✅ Seed applied successfully"

      - name: Start Gateway service (real Keycloak mode, NO test secret)
        run: |
          echo "Starting Gateway service with Keycloak OIDC..."
          docker run -d --name gateway-api-e2e --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e APP_PORT=8080 \
            -e BONUS_API_URL=http://localhost:8050 \
            -e FLIGHT_API_URL=http://localhost:8060 \
            -e TICKET_API_URL=http://localhost:8070 \
            -e OIDC_ISSUER=http://localhost:8888/realms/rsoi \
            -e OIDC_JWKS_URI=http://localhost:8888/realms/rsoi/protocol/openid-connect/certs \
            -e OIDC_CLIENT_ID=gateway \
            -e OIDC_CLIENT_SECRET=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj \
            gateway-microservice:api
          
          echo "⏳ Waiting for Gateway to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/manage/health > /dev/null 2>&1; then
              echo "✅ Gateway ready!"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done
          echo "--- Gateway env check ---"
          docker exec gateway-api-e2e env | grep -E "OIDC|BONUS|FLIGHT|TICKET" | sort

      - name: Build Newman instructor image
        run: |
          echo "Building Postman Newman image for Fault Tolerance Tests..."
          docker build \
            --tag postman-newman-instructor:e2e \
            -f postman/Dockerfile \
            postman/
          echo "✅ Postman Newman image built: postman-newman-instructor:e2e"

      - name: Run fault-tolerance success folder (baseline)
        run: |
          echo "Running fault-tolerance success folder..."
          mkdir -p postman/test-results
          docker run --rm \
            --network host \
            -v "$(pwd)/postman/test-results:/etc/newman/results" \
            postman-newman-instructor:e2e \
            run /etc/newman/fault-tolerance-collection.json \
              -e /etc/newman/environment.json \
              --env-var "identityProviderUrl=http://localhost:8888/realms/rsoi" \
              --env-var "serviceUrl=http://localhost:8080" \
              --env-var "clientId=gateway" \
              --env-var "clientSecret=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj" \
              --env-var "username=testuser" \
              --env-var "password=test" \
              --folder success \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/success.xml \
              --export-environment /etc/newman/results/env-after-success.json

      - name: Step 1 — stop Bonus Service
        run: |
          echo "=== Step 1: Stopping Bonus Service ==="
          docker stop bonus-api-e2e
          
          docker run --rm \
            --network host \
            -v "$(pwd)/postman/test-results:/etc/newman/results" \
            postman-newman-instructor:e2e \
            run /etc/newman/fault-tolerance-collection.json \
              -e /etc/newman/results/env-after-success.json \
              --env-var "identityProviderUrl=http://localhost:8888/realms/rsoi" \
              --env-var "serviceUrl=http://localhost:8080" \
              --env-var "clientId=gateway" \
              --env-var "clientSecret=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj" \
              --env-var "username=testuser" \
              --env-var "password=test" \
              --folder step1 \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/step1.xml \
              --export-environment /etc/newman/results/env-after-step1.json

      - name: Step 2 — start Bonus Service
        run: |
          echo "=== Step 2: Starting Bonus Service ==="
          docker start bonus-api-e2e
          
          echo "⏳ Waiting for Bonus Service to be ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:8050/manage/health > /dev/null 2>&1; then
              echo "✅ Bonus Service ready"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done
          
          # Give Circuit Breaker time to probe and close
          echo "⏳ Waiting for Circuit Breaker to probe..."
          sleep 5
          
          docker run --rm \
            --network host \
            -v "$(pwd)/postman/test-results:/etc/newman/results" \
            postman-newman-instructor:e2e \
            run /etc/newman/fault-tolerance-collection.json \
              -e /etc/newman/results/env-after-step1.json \
              --env-var "identityProviderUrl=http://localhost:8888/realms/rsoi" \
              --env-var "serviceUrl=http://localhost:8080" \
              --env-var "clientId=gateway" \
              --env-var "clientSecret=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj" \
              --env-var "username=testuser" \
              --env-var "password=test" \
              --folder step2 \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/step2.xml \
              --export-environment /etc/newman/results/env-after-step2.json

      - name: Step 3 — stop Bonus Service again
        run: |
          echo "=== Step 3: Stopping Bonus Service again ==="
          docker stop bonus-api-e2e
          
          docker run --rm \
            --network host \
            -v "$(pwd)/postman/test-results:/etc/newman/results" \
            postman-newman-instructor:e2e \
            run /etc/newman/fault-tolerance-collection.json \
              -e /etc/newman/results/env-after-step2.json \
              --env-var "identityProviderUrl=http://localhost:8888/realms/rsoi" \
              --env-var "serviceUrl=http://localhost:8080" \
              --env-var "clientId=gateway" \
              --env-var "clientSecret=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj" \
              --env-var "username=testuser" \
              --env-var "password=test" \
              --folder step3 \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/step3.xml \
              --export-environment /etc/newman/results/env-after-step3.json

      - name: Step 4 — start Bonus Service again (final check)
        run: |
          echo "=== Step 4: Starting Bonus Service again ==="
          docker start bonus-api-e2e
          
          echo "⏳ Waiting for Bonus Service to be ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:8050/manage/health > /dev/null 2>&1; then
              echo "✅ Bonus Service ready"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done
          
          # Give Circuit Breaker time to probe and close
          echo "⏳ Waiting for Circuit Breaker to probe..."
          sleep 5
          
          # Wait for retry-queue to flush rollback (max 30s)
          echo "⏳ Waiting for retry-queue to flush rollback (max 30s)..."
          for i in {1..15}; do
            TOKEN=$(curl -s -X POST http://localhost:8888/realms/rsoi/protocol/openid-connect/token \
              -d 'grant_type=password' \
              -d 'client_id=gateway' \
              -d 'client_secret=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj' \
              -d 'username=testuser' \
              -d 'password=test' \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null)
            BALANCE=$(curl -s -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/v1/privilege \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("balance",-1))' 2>/dev/null || echo -1)
            echo "  attempt $i/15: balance=$BALANCE (expected 10000)"
            [ "$BALANCE" = "10000" ] && break
            sleep 2
          done
          
          docker run --rm \
            --network host \
            -v "$(pwd)/postman/test-results:/etc/newman/results" \
            postman-newman-instructor:e2e \
            run /etc/newman/fault-tolerance-collection.json \
              -e /etc/newman/results/env-after-step3.json \
              --env-var "identityProviderUrl=http://localhost:8888/realms/rsoi" \
              --env-var "serviceUrl=http://localhost:8080" \
              --env-var "clientId=gateway" \
              --env-var "clientSecret=uc0YsBgNzVIjrGqcBfeYOhUJ5WzAOfmj" \
              --env-var "username=testuser" \
              --env-var "password=test" \
              --folder step4 \
              --reporters cli,junit \
              --reporter-junit-export /etc/newman/results/step4.xml

      - name: Upload Fault Tolerance test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-tolerance-junit-results
          path: |
            postman/test-results/*.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Publish Fault Tolerance test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Fault Tolerance - Bonus Service failover (Postman)
          path: postman/test-results/*.xml
          reporter: java-junit

      - name: Debug — Keycloak logs (on failure)
        if: failure()
        run: |
          echo "=== Keycloak logs (last 100 lines) ==="
          docker logs keycloak 2>&1 | tail -100

      - name: Debug — Gateway logs (on failure)
        if: failure()
        run: |
          echo "=== Gateway logs (last 100 lines) ==="
          docker logs gateway-api-e2e 2>&1 | tail -100

      - name: Cleanup Docker containers
        if: always()
        run: |
          echo "🧹 Cleaning up Docker containers..."
          docker rm -f gateway-api-e2e bonus-api-e2e flight-api-e2e ticket-api-e2e \
            postgres-bonus-tests postgres-flight-tests postgres-ticket-tests keycloak 2>/dev/null || true
          echo "✅ Cleanup complete"
