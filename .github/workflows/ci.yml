# ===========================================
# CI Pipeline - Build and Test
# ===========================================
# Best Practices:
# - Specific action versions (security)
# - Concurrency control (prevent duplicate runs)
# - Fail-fast disabled (run all tests)
# - Cache optimization (faster builds)
# - Matrix testing (if needed)
# - Security scanning (CodeQL)
# - Dependency review

name: CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ===========================================
# Concurrency Control
# ===========================================
# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# ===========================================
# Default Settings
# ===========================================
defaults:
  run:
    shell: bash

jobs:
  # ===========================================
  # Security: CodeQL Analysis
  # ===========================================
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  # ===========================================
  # Build Job
  # ===========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full git history

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: |
          dotnet restore src/presentation/presentation.csproj
          dotnet restore src/tests/tests.csproj
          echo "✅ Dependencies restored"

      - name: Build application
        run: |
          dotnet build src/presentation/presentation.csproj --no-restore --configuration Release --verbosity normal
          echo "✅ Build completed"

      - name: Analyze dependencies
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate
          allow-licenses: MIT,Apache-2.0,MIT AND Apache-2.0

  # ===========================================
  # Unit Tests Job
  # ===========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore src/presentation/presentation.csproj
          dotnet restore src/tests/tests.csproj

      - name: Run unit tests
        run: |
          mkdir -p ./TestResults
          dotnet test src/tests/tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~Unit" \
            --verbosity normal \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"
        continue-on-error: false

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ runner.os }}
          path: |
            ./TestResults/*.trx
            ./TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "**/*.trx"
          output: test-summary.md

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-summary-${{ runner.os }}
          path: test-summary.md
          retention-days: 7

      - name: Publish test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Unit Test Results
          path: ./TestResults/*.trx
          reporter: dotnet-trx

  # ===========================================
  # Integration Tests Job
  # ===========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      checks: write
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: test_persons
          POSTGRES_USER: program
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore src/presentation/presentation.csproj
          dotnet restore src/tests/tests.csproj

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U program; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✅ PostgreSQL is ready"

      - name: Create database schema
        run: |
          PGPASSWORD=test psql -h localhost -p 5432 -U program -d test_persons -c "
            CREATE TABLE IF NOT EXISTS persons (
              id SERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              age INTEGER,
              address VARCHAR(500),
              work VARCHAR(255)
            );
          "
          echo "✅ Database schema created"

      - name: Run integration tests
        run: |
          mkdir -p ./TestResults
          dotnet test src/tests/tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~Integration" \
            --verbosity normal \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"
        env:
          DATABASE_PROVIDER: POSTGRESQL
          POSTGRESQL_HOST: localhost
          POSTGRESQL_PORT: 5432
          POSTGRESQL_DATABASE: test_persons
          POSTGRESQL_USER: program
          POSTGRESQL_PASSWORD: test

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-${{ runner.os }}
          path: |
            ./TestResults/*.trx
            ./TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "**/*.trx"
          output: integration-test-summary.md

      - name: Upload integration test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-summary-${{ runner.os }}
          path: integration-test-summary.md
          retention-days: 7

      - name: Publish integration test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Integration Test Results
          path: ./TestResults/*.trx
          reporter: dotnet-trx

  # ===========================================
  # Docker Build Test Job
  # ===========================================
  docker-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore dependencies
        run: |
          dotnet restore src/presentation/presentation.csproj

      - name: Build Docker image (test)
        id: docker-build
        run: |
          docker build \
            --tag person-service:test \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VERSION=${{ github.sha }} \
            --progress=plain \
            .
          echo "image=person-service:test" >> $GITHUB_OUTPUT

      - name: Test Docker image
        run: |
          echo "🐳 Starting Docker container in background..."
          
          # Start container in background (detach mode)
          docker run -d --name person-service-test -p 8080:8080 person-service:test
          
          echo "⏳ Waiting for application to start..."
          
          # Wait for application to be ready (max 60 seconds)
          # Note: Health check may fail without database, so we just check if app is responding
          for i in {1..30}; do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1 || \
               curl -sf http://localhost:8080/health > /dev/null 2>&1 || \
               curl -sf http://localhost:8080/api/persons > /dev/null 2>&1; then
              echo "✅ Application is responding!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Application failed to start within 60 seconds"
              echo "📋 Container logs:"
              docker logs person-service-test
              docker rm -f person-service-test
              exit 1
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done
          
          echo "✅ Docker image verification completed!"
          echo "🧹 Cleaning up..."
          
          # Cleanup
          docker rm -f person-service-test
          
          echo "✅ Docker test completed successfully!"

      - name: Check Docker image size
        id: image-size
        run: |
          SIZE=$(docker images person-service:test --format "{{.Size}}")
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "Docker image size: $SIZE"

      - name: Inspect Docker image
        run: |
          docker inspect person-service:test --format '{{.Config.User}}'
          docker inspect person-service:test --format '{{.Config.ExposedPorts}}'

      - name: Run Docker security scan
        uses: aquasecurity/trivy-action@master
        if: github.event_name == 'pull_request'
        with:
          image-ref: 'person-service:test'
          format: 'table'
          exit-code: '0'  # Don't fail PR on vulnerabilities
          severity: 'CRITICAL,HIGH'

  # ===========================================
  # API E2E Tests Job
  # ===========================================
  api-e2e-tests:
    name: API E2E Tests (Postman)
    runs-on: ubuntu-latest
    needs: integration-tests
    permissions:
      contents: read
      checks: write
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: test_persons
          POSTGRES_USER: program
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore src/presentation/presentation.csproj

      - name: Build application
        run: |
          dotnet build src/presentation/presentation.csproj --no-restore --configuration Release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing
        run: |
          docker build \
            --tag person-service:e2e-test \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VERSION=${{ github.sha }} \
            .
          echo "✅ Docker image built: person-service:e2e-test"

      - name: Build Postman Newman image
        run: |
          docker build \
            --tag postman-newman:e2e \
            -f postman/Dockerfile \
            postman/
          echo "✅ Postman Newman image built: postman-newman:e2e"

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U program; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✅ PostgreSQL is ready"

      - name: Create database schema
        run: |
          PGPASSWORD=test psql -h localhost -p 5432 -U program -d test_persons -c "
            CREATE TABLE IF NOT EXISTS persons (
              id SERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              age INTEGER,
              address VARCHAR(500),
              work VARCHAR(255)
            );
          "
          echo "✅ Database schema created"

      - name: Start application container
        run: |
          docker run -d \
            --name person-service-e2e \
            --network host \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e DATABASE_PROVIDER=POSTGRESQL \
            -e POSTGRESQL_HOST=localhost \
            -e POSTGRESQL_PORT=5432 \
            -e POSTGRESQL_DATABASE=test_persons \
            -e POSTGRESQL_USER=program \
            -e POSTGRESQL_PASSWORD=test \
            person-service:e2e-test
          echo "⏳ Waiting for application to start..."
          sleep 10

      - name: Wait for application to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Application is ready!"
              exit 0
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done
          echo "❌ Application failed to start"
          docker logs person-service-e2e
          exit 1

      - name: Run Postman E2E tests
        run: |
          mkdir -p ./postman/test-results
          docker run --rm \
            --network host \
            -v $(pwd)/postman/test-results:/app/test-results \
            postman-newman:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-e2e-test-results
          path: |
            ./postman/test-results/*.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Publish E2E test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: API E2E Test Results (Postman)
          path: ./postman/test-results/*.xml
          reporter: jest