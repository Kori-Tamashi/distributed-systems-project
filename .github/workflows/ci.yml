# ===========================================
# CI Pipeline - Build and Test
# ===========================================
# Best Practices:
# - Specific action versions (security)
# - Concurrency control (prevent duplicate runs)
# - Fail-fast disabled (run all tests)
# - Cache optimization (faster builds)
# - Matrix testing (if needed)
# - Security scanning (CodeQL)
# - Dependency review

name: CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ===========================================
# Concurrency Control
# ===========================================
# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# ===========================================
# Default Settings
# ===========================================
defaults:
  run:
    shell: bash

jobs:
  # ===========================================
  # Security: CodeQL Analysis
  # ===========================================
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  # ===========================================
  # Build Job
  # ===========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full git history

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: |
          dotnet restore src/presentation/presentation.csproj
          dotnet restore src/tests/tests.csproj
          echo "✅ Dependencies restored"

      - name: Build application
        run: |
          dotnet build src/presentation/presentation.csproj --no-restore --configuration Release --verbosity normal
          echo "✅ Build completed"

      - name: Analyze dependencies
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate
          allow-licenses: MIT,Apache-2.0,MIT AND Apache-2.0

  # ===========================================
  # Unit Tests Job
  # ===========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore src/presentation/presentation.csproj
          dotnet restore src/tests/tests.csproj

      - name: Run unit tests
        run: |
          mkdir -p ./TestResults
          dotnet test src/tests/tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~Unit" \
            --verbosity normal \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"
        continue-on-error: false

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ runner.os }}
          path: |
            ./TestResults/*.trx
            ./TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "**/*.trx"
          output: test-summary.md

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-summary-${{ runner.os }}
          path: test-summary.md
          retention-days: 7

      - name: Publish test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Unit Test Results
          path: ./TestResults/*.trx
          reporter: dotnet-trx

  # ===========================================
  # Integration Tests Job
  # ===========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      checks: write
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: test_persons
          POSTGRES_USER: program
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore src/presentation/presentation.csproj
          dotnet restore src/tests/tests.csproj

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U program; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✅ PostgreSQL is ready"

      - name: Run integration tests
        run: |
          mkdir -p ./TestResults
          dotnet test src/tests/tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~Integration" \
            --verbosity normal \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"
        env:
          DATABASE_PROVIDER: POSTGRESQL
          POSTGRESQL_HOST: localhost
          POSTGRESQL_PORT: 5432
          POSTGRESQL_DATABASE: test_persons
          POSTGRESQL_USER: program
          POSTGRESQL_PASSWORD: test

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-${{ runner.os }}
          path: |
            ./TestResults/*.trx
            ./TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "**/*.trx"
          output: integration-test-summary.md

      - name: Upload integration test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-summary-${{ runner.os }}
          path: integration-test-summary.md
          retention-days: 7

      - name: Publish integration test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Integration Test Results
          path: ./TestResults/*.trx
          reporter: dotnet-trx

  # ===========================================
  # Docker Build Test Job
  # ===========================================
  docker-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: integration-tests
    permissions:
      contents: read
    
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore dependencies
        run: |
          dotnet restore src/presentation/presentation.csproj

      - name: Build Docker image (test)
        id: docker-build
        run: |
          docker build \
            --tag person-service:test \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VERSION=${{ github.sha }} \
            --progress=plain \
            .
          echo "image=person-service:test" >> $GITHUB_OUTPUT

      - name: Test Docker image
        run: |
          docker run --rm person-service:test dotnet --version
          docker run --rm person-service:test dotnet --list-sdks

      - name: Check Docker image size
        id: image-size
        run: |
          SIZE=$(docker images person-service:test --format "{{.Size}}")
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "Docker image size: $SIZE"

      - name: Inspect Docker image
        run: |
          docker inspect person-service:test --format '{{.Config.User}}'
          docker inspect person-service:test --format '{{.Config.ExposedPorts}}'

      - name: Run Docker security scan
        uses: aquasecurity/trivy-action@master
        if: github.event_name == 'pull_request'
        with:
          image-ref: 'person-service:test'
          format: 'table'
          exit-code: '0'  # Don't fail PR on vulnerabilities
          severity: 'CRITICAL,HIGH'