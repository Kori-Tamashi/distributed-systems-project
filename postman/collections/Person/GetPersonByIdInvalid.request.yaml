$kind: http-request
order: 8000
method: GET
url: '{{baseUrl}}/api/v1/persons/-1'
description: |
  ## Get Person By ID (Invalid ID)
  
  **Метод:** GET  
  **Endpoint:** `/api/v1/persons/{id}`  
  **Ожидаемый статус:** 400 Bad Request  
  
  ### Описание
  Проверяет валидацию при получении Person с невалидным ID (отрицательное число).  
  ID должен быть положительным целым числом.
  
  ### Path Parameters
  - `id` - невалидный ID (-1)
  
  ### Ожидаемый результат
  - Статус: 400 Bad Request
  - Валидация ID происходит до проверки существования
  
  ### Автор
  Lab 01 - CI/CD Pipeline (2026-09-10)
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400 Bad Request', function () {
          pm.response.to.have.status(400);
      });
