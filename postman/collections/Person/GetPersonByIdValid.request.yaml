$kind: http-request
order: 7000
method: GET
url: '{{baseUrl}}/api/v1/persons/{{createdPersonId}}'
description: |
  ## Get Person By ID (Valid)
  
  **Метод:** GET  
  **Endpoint:** `/api/v1/persons/{id}`  
  **Ожидаемый статус:** 200 OK  
  
  ### Описание
  Получает созданного ранее Person по ID.  
  Использует `createdPersonId` из предыдущего теста CreatePersonValid.
  
  ### Path Parameters
  - `id` - ID созданного человека (берётся из переменной коллекции)
  
  ### Ожидаемый результат
  - Статус: 200 OK
  - Ответ содержит данные созданного человека
  - Имя и возраст соответствуют отправленным при создании
  
  ### Предусловия
  - Тест CreatePersonValid должен быть выполнен успешно
  
  ### Автор
  Lab 01 - CI/CD Pipeline (2026-09-10)
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Person data matches created data', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.id).to.equal(parseInt(pm.collectionVariables.get('createdPersonId')));
          pm.expect(jsonData.name).to.equal('John Doe');
          pm.expect(jsonData.age).to.equal(30);
      });
