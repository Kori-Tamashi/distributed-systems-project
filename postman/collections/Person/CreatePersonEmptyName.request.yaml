$kind: http-request
order: 4000
method: POST
url: '{{baseUrl}}/api/v1/persons'
headers:
  - key: Content-Type
    value: application/json
description: |
  ## Create Person (Empty Name - Validation Test)
  
  **Метод:** POST  
  **Endpoint:** `/api/v1/persons`  
  **Ожидаемый статус:** 400 Bad Request  
  
  ### Описание
  Проверяет валидацию при создании Person с пустым именем.  
  Имя является обязательным полем.
  
  ### Request Body
  ```json
  {
    "name": "",
    "age": 25,
    "address": "456 Test St",
    "work": "Tester"
  }
  ```
  
  ### Ожидаемый результат
  - Статус: 400 Bad Request
  - Ответ содержит поле `message` с описанием ошибки валидации
  
  ### Автор
  Lab 01 - CI/CD Pipeline (2026-09-10)
body:
  type: json
  content: |-
    {
      "name": "",
      "age": 25,
      "address": "456 Test St",
      "work": "Tester"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400 Bad Request', function () {
          pm.response.to.have.status(400);
      });

      pm.test('Response contains error message', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('message');
      });
