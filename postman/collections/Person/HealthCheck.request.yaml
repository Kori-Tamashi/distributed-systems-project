$kind: http-request
order: 1000
method: GET
url: '{{baseUrl}}/health'
description: |
  ## Health Check
  
  **Метод:** GET  
  **Endpoint:** `/health`  
  **Ожидаемый статус:** 200 OK  
  
  ### Описание
  Проверяет работоспособность приложения.  
  Health endpoint должен отвечать на запросы для мониторинга состояния сервиса.
  
  ### Ожидаемый результат
  - Статус: 200 OK
  - Время ответа: < 1000ms
  
  ### Автор
  Lab 01 - CI/CD Pipeline (2026-09-10)
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Health endpoint responds', function () {
          // Health check may return text or JSON, just check it responds
          pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      pm.test('Response time is acceptable (< 1000ms)', function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
