$kind: http-request
order: 10000
method: PATCH
url: '{{baseUrl}}/api/v1/persons/{{createdPersonId}}'
headers:
  - key: Content-Type
    value: application/json
description: |
  ## Update Person (Valid)
  
  **Метод:** PATCH  
  **Endpoint:** `/api/v1/persons/{id}`  
  **Ожидаемый статус:** 200 OK  
  
  ### Описание
  Обновляет данные созданного ранее Person.  
  Использует `createdPersonId` из теста CreatePersonValid.
  
  ### Path Parameters
  - `id` - ID человека для обновления
  
  ### Request Body
  ```json
  {
    "id": {{createdPersonId}},
    "name": "Jane Doe",
    "age": 31,
    "address": "999 Updated St",
    "work": "Senior Developer"
  }
  ```
  
  ### Важно
  ID в URL должен совпадать с ID в теле запроса!
  
  ### Ожидаемый результат
  - Статус: 200 OK
  - Все поля обновлены корректно
  
  ### Предусловия
  - Тест CreatePersonValid должен быть выполнен успешно
  
  ### Автор
  Lab 01 - CI/CD Pipeline (2026-09-10)
body:
  type: json
  content: |-
    {
      "id": {{createdPersonId}},
      "name": "Jane Doe",
      "age": 31,
      "address": "999 Updated St",
      "work": "Senior Developer"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Person data updated correctly', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.name).to.equal('Jane Doe');
          pm.expect(jsonData.age).to.equal(31);
          pm.expect(jsonData.address).to.equal('999 Updated St');
          pm.expect(jsonData.work).to.equal('Senior Developer');
      });
