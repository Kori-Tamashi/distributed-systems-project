    event:
      - listen: test
        script:
          exec:
            - "pm.test('Status is 400 (Bad Request)', function () {"
            - "    pm.response.to.have.status(400);"
            - "});"

  # ==========================================
  # Delete Person - Not Found
  # ==========================================
  - name: "16 - DeletePerson - Not Found"
    request:
      method: DELETE
      header: []
      url:
        raw: "{{baseUrl}}/api/persons/99999"
        host:
