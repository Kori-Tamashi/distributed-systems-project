  # ==========================================
  # Cleanup - Create and Delete for Clean State
  # ==========================================
  - name: "17 - Cleanup - Create Test Person"
    request:
      method: POST
      header:
        - key: Content-Type
          value: application/json
      url:
        raw: "{{baseUrl}}/api/persons"
        host:
          - "{{baseUrl}}"
        path:
          - api
          - persons
      body:
        mode: raw
        raw: |
          {
            "name": "Cleanup Test",
            "age": 25,
            "address": "Cleanup St",
            "work": "Test"
          }
    event:
      - listen: test
        script:
          exec:
            - "pm.test('Status is 201', function () {"
            - "    pm.response.to.have.status(201);"
            - "});"
            - ""
            - "var jsonData = pm.response.json();"
            - "pm.collectionVariables.set('cleanupPersonId', jsonData.id);"

  - name: "18 - Cleanup - Delete Test Person"
    request:
      method: DELETE
      header: []
      url:
        raw: "{{baseUrl}}/api/persons/{{cleanupPersonId}}"
        host:
          - "{{baseUrl}}"
        path:
          - api
          - persons
          - "{{cleanupPersonId}}"
    event:
      - listen: test
        script:
          exec:
            - "pm.test('Status is 200', function () {"
            - "    pm.response.to.have.status(200);"
            - "});"
            - ""
            - "console.log('Cleanup completed successfully');"
