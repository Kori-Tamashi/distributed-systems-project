$kind: http-request
order: 1000
method: GET
url: '{{baseUrl}}/health'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Health endpoint responds', function () {
          // Health check may return text or JSON, just check it responds
          pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      pm.test('Response time is acceptable (< 1000ms)', function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
