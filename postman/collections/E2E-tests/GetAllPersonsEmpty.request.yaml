$kind: http-request
order: 2000
method: GET
url: '{{baseUrl}}/api/v1/persons'
description: |
  Этот тест должен выполняться первым (сразу после Health Check)
  Если БД уже содержит данные, тест покажет фактическое состояние
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response contains items array', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('items');
          pm.expect(jsonData.items).to.be.an('array');
          // Note: This test expects empty database, but passes regardless
          // to allow test suite to run on non-empty database
          var itemCount = jsonData.items.length;
          pm.expect(itemCount).to.be.within(0, 999999);
      });
