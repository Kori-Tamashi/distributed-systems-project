$kind: http-request
order: 2000
method: GET
url: '{{baseUrl}}/api/v1/persons'
description: |
  Этот тест должен выполняться первым (сразу после Health Check)
  Если БД уже содержит данные, тест покажет фактическое состояние
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response contains items array', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('items');
          pm.expect(jsonData.items).to.be.an('array');
          // Note: This test may fail if database already has data from previous runs
          // It's designed to pass on empty database
          if (jsonData.items.length === 0) {
              pm.pass('Database is empty as expected');
          } else {
              pm.pass(`Database has ${jsonData.items.length} person(s) - may be from previous test runs`);
          }
      });
