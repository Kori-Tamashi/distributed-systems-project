$kind: http-request
order: 10000
method: PATCH
url: '{{baseUrl}}/api/persons/{{createdPersonId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Jane Doe",
      "age": 31,
      "address": "999 Updated St",
      "work": "Senior Developer"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Person data updated correctly', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.name).to.equal('Jane Doe');
          pm.expect(jsonData.age).to.equal(31);
          pm.expect(jsonData.address).to.equal('999 Updated St');
          pm.expect(jsonData.work).to.equal('Senior Developer');
      });
