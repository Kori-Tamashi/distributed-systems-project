$kind: http-request
order: 7000
method: GET
url: '{{baseUrl}}/api/persons/{{createdPersonId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Person data matches created data', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.id).to.equal(parseInt(pm.collectionVariables.get('createdPersonId')));
          pm.expect(jsonData.name).to.equal('John Doe');
          pm.expect(jsonData.age).to.equal(30);
      });
