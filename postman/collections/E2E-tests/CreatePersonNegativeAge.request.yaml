$kind: http-request
order: 6000
method: POST
url: '{{baseUrl}}/api/persons'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Time Traveler",
      "age": -5,
      "address": "100 Time St",
      "work": "Unknown"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 400 Bad Request', function () {
          pm.response.to.have.status(400);
      });

      pm.test('Response contains validation error', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('message');
      });
