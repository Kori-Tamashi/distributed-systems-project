services:
  # =============================================================================
  # Application Service
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: "1.0.0"
        BUILD_DATE: "${BUILD_DATE}"
    container_name: dsp-person-api
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env
    depends_on:
      postgres-prod:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
    networks:
      - dsp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =============================================================================
  # PostgreSQL Production Database
  # =============================================================================
  postgres-prod:
    image: postgres:14-alpine
    container_name: dsp-postgres-prod
    ports:
      - "${POSTGRES_PROD_PORT_EXTERNAL}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_PROD_DATABASE}
      POSTGRES_USER: ${POSTGRES_PROD_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PROD_PASSWORD}
    volumes:
      - ${POSTGRES_PROD_DATA_PATH}:/var/lib/postgresql/data
    networks:
      - dsp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_PROD_USER} -d ${POSTGRES_PROD_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # PostgreSQL Test Database
  # =============================================================================
  postgres-test:
    image: postgres:14-alpine
    container_name: dsp-postgres-test
    ports:
      - "${POSTGRES_TEST_PORT_EXTERNAL}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DATABASE}
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
    networks:
      - dsp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER} -d ${POSTGRES_TEST_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# =============================================================================
# Networks
# =============================================================================
networks:
  dsp-network:
    driver: bridge
